}

function metaFoto(f) {
  const q = f.tiradaEm ? new Date(f.tiradaEm) : null;
  const p = [];
  if (q) p.push(`<span>${q.toLocaleDateString('pt-BR')} ${pad(q.getHours())}:${pad(q.getMinutes())}</span>`);
  if (f.lat === null || f.lat === undefined) p.push('<span class="warn">sem localização</span>');
  else if (f.distanciaObraM !== null && f.distanciaObraM !== undefined && f.distanciaObraM > raioObra()) p.push(`<span class="bad">a ${distTxt(f.distanciaObraM)} da obra</span>`);
  else {
    const end = f.endereco || [];
    const cid = end.find(l => / - [A-Z]{2}$/.test(l)) || end[0];
    p.push(`<span class="ok">${ic('i-pin', 14)} georreferenciada${cid ? ' · ' + esc(cid) : ''}</span>`);
    if (!end.length) p.push('<span>endereço entra quando houver sinal</span>');
  }
  return `<div class="foto-meta">${p.join('')}</div>`;
}

/* ---------- vista geral da obra (fachada): mínimo 2 por semana, o ideal é em todo diário ---------- */
const VG_MIN_SEMANA = 2;
const LEGENDA_GERAL = 'Vista geral da obra (fachada)';
function segundaDa(iso) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoLocal(d); }
function maisDias(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); }
function vistaGeralSemana(rd) {
  const seg = segundaDa(rd.data), dom = maisDias(seg, 6);
  const ob = obraDe(rd.obra) || {};
  const datas = new Set((ob.vistaGeral || []).filter(d => d >= seg && d <= dom && d !== rd.data));
  S.fila.filter(it => it.obra === rd.obra && !['descartado', 'rejeitado'].includes(it.estado) && it.data !== rd.data && it.data >= seg && it.data <= dom && (it.fotos || []).some(f => f.geral))
    .forEach(it => datas.add(it.data));
  const esta = rd.fotos.some(f => f.geral);
  return { outras: datas.size, total: datas.size + (esta ? 1 : 0), esta, seg, dom };
}
async function guardarRefGeral(rd) {
  const f = rd.fotos.find(x => x.geral);
  if (!f) return;
  try {
    const reg = await DB.get('fotos', f.id);
    if (!reg) return;
    const img = await decodificar(new Blob([reg.buf], { type: reg.type || 'image/jpeg' }));
    const w = 480, h = Math.round(w * (img.height || reg.h) / (img.width || reg.w));
    const cv = novoCanvas(w, h); cv.getContext('2d').drawImage(img, 0, 0, w, h); if (img.close) img.close();
    const ref = { data: rd.data, img: cv.toDataURL('image/jpeg', 0.62) };
    await DB.put('kv', 'refGeral:' + rd.obra, ref);
    (S.refGeral = S.refGeral || {})[rd.obra] = ref;
  } catch (e) { /* a referência é só uma ajuda */ }
}
function cartaoVistaGeral(rd) {
  const vg = vistaGeralSemana(rd);
  const ref = S.refGeral && S.refGeral[rd.obra];
  const cumpre = vg.total >= VG_MIN_SEMANA;
  return `<section class="cartao" style="border-left:4px solid ${vg.esta ? 'var(--rec)' : (vg.outras >= VG_MIN_SEMANA ? 'var(--cli)' : 'var(--venc)')}">
    <div class="orienta">${ic('i-galeria', 48)}<div><b>Vista geral da obra (fachada)</b>
      <span>Uma foto da obra inteira, <strong>sempre do mesmo ponto e no mesmo ângulo</strong>, para comparar a evolução ao longo do tempo. Foto de perto do serviço não mostra o andamento geral.</span></div></div>
    <p style="margin:0">Mínimo de <b>${VG_MIN_SEMANA} por semana</b>; o ideal é em todo diário. Nesta semana: <b>${vg.total} de ${VG_MIN_SEMANA}</b>${cumpre ? ' ✓' : ''}</p>
    ${ref ? `<div style="display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center"><img src="${ref.img}" alt="Última vista geral" style="width:120px;border-radius:8px;display:block">
      <span class="mudo" style="font-size:14px">Última vista geral (${br(ref.data)}). Fique no mesmo lugar e repita este enquadramento.</span></div>` : ''}
    ${vg.esta ? `<div class="estado ok">${ic('i-check')}<span>Vista geral registrada neste diário<small>É a foto nº 1.</small></span></div>`
      : `<div class="botoes-foto"><button class="btn primario" data-act="cameraGeral">${ic('i-camera', 26)} Vista geral</button>
         <button class="btn" data-act="galeriaGeral">${ic('i-galeria', 26)} Da galeria</button></div>`}
  </section>`;
}
function marcarGeral(rd, i, valor) {
  rd.fotos.forEach((f, k) => {
    if (k === i) { f.geral = valor; if (valor && !f.legenda) f.legenda = LEGENDA_GERAL; if (!valor && f.legenda === LEGENDA_GERAL) f.legenda = ''; }
    else if (valor && f.geral) { f.geral = false; if (f.legenda === LEGENDA_GERAL) f.legenda = ''; }
  });
  if (valor) { const f = rd.fotos.splice(i, 1)[0]; rd.fotos.unshift(f); }   // vista geral é sempre a foto nº 1
}

function passoFotos(rd) {
  iniciarGPS();
  const total = rd.fotos.reduce((s, f) => s + (f.bytes || 0), 0);
  let html = `<section class="cartao"><div class="orienta">${ic('i-deitado', 54)}<div><b>Celular deitado, sempre</b>
      <span>Foto horizontal, como nos relatórios fotográficos da Caixa e da fiscalização. Foto em pé é recortada ou descartada.</span></div></div>
    ${htmlGps()}</section>
    ${cartaoVistaGeral(rd)}
    <p style="margin:6px 0 0"><b>Fotos dos serviços</b> <span class="mudo">· frente de trabalho, detalhes e problemas do dia</span></p>
    <div class="botoes-foto">
    <button class="btn primario" data-act="camera">${ic('i-camera', 28)} Tirar foto</button>
    <button class="btn" data-act="galeria">${ic('i-galeria', 28)} Da galeria</button></div>
    <p class="mudo" style="margin:0">${rd.fotos.length ? `${rd.fotos.length} foto(s) · ${mb(total)} · ` : ''}Cada foto sai com a marca Rijo, data, hora, coordenadas e endereço. Ficam no celular até o envio.</p>`;
  if (!rd.fotos.length) return html + `<section class="cartao vazio">${ic('i-camera', 36)}<b>Nenhuma foto ainda</b><span>Fotografe os serviços do dia: frente de trabalho, detalhes, problemas. Use "Tirar foto" para a foto sair georreferenciada.</span></section>`;
  const servs = rd.servicos;
  html += `<section class="cartao"><div class="grade-fotos">${rd.fotos.map((f, i) => `<div class="foto">
      <div class="foto-img"><img data-foto="${f.id}" alt="Foto ${i + 1}"><span class="n">${i + 1}${f.geral ? ' · VISTA GERAL' : ''}</span>
        <button class="rm" data-act="rmFoto" data-i="${i}" aria-label="Remover foto ${i + 1}">${ic('i-x', 18)}</button></div>
      ${metaFoto(f)}
      <input type="text" data-bind="legenda" data-i="${i}" value="${esc(f.legenda)}" placeholder="Legenda (ex.: alvenaria eixo B)" aria-label="Legenda da foto ${i + 1}">
      <button class="chip" data-act="marcarGeral" data-i="${i}" aria-pressed="${!!f.geral}" style="justify-self:start">${f.geral ? 'É a vista geral ✓' : 'Marcar como vista geral'}</button>
      ${servs.length ? `<select data-bind="fotoServ" data-i="${i}" aria-label="Serviço da foto ${i + 1}"><option value="">Serviço (opcional)</option>${servs.map(s => `<option value="${esc(s.id)}" ${f.idServico === s.id ? 'selected' : ''}>${esc(s.nome)}</option>`).join('')}</select>` : ''}
    </div>`).join('')}</div></section>`;
  return html;
}

function passoOcorrencias(rd) {
  return `<div class="saudacao"><b>Ocorrências e observações</b><span>Visitas, entregas, paralisações, problemas. Toque nos atalhos para começar a linha.</span></div>
    <section class="cartao"><div class="chips">${ATALHOS_OCORRENCIA.map(a => `<button class="chip" data-act="atalho" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>
    <textarea id="txtOcorr" data-bind="ocorrencias" placeholder="Ex.: Entrega de 8 m³ de concreto às 10h. Chuva forte das 14h às 15h30 parou a alvenaria.">${esc(rd.ocorrencias)}</textarea>
    <label class="liga"><input type="checkbox" data-bind="semOcorr" ${rd.semOcorrencias ? 'checked' : ''}> Sem ocorrências neste dia</label></section>`;
}

function passoRevisar(rd) {
  const p = pendencias(rd);
  const ativos = rd.equipe.filter(c => !c.saida);
  const pres = ativos.filter(c => c.presente).length;
  const clima = PERIODOS.filter(x => rd.clima[x.id].checked).map(x => {
    const c = rd.clima[x.id]; const t = TEMPOS.find(t => t.id === c.weather);
    return `${x.nome}: ${t ? t.nome : '—'}${c.status === 'impractical' ? ' (impraticável)' : ''}`;
  }).join(' · ') || '—';
  const serv = rd.servicos.filter(s => s.trabalhou || s.percentual !== s.anterior || s.novo);
  const movs = rd.equipe.filter(c => c.novo || c.chegada || c.saida);
  let html = `<div class="saudacao"><b>Revisar e enviar</b><span>${esc(rd.obra)} · ${dataLonga(rd.data)}</span></div>`;
  if (p.bloq.length || p.avisos.length) {
    html += `<section class="cartao pend">${p.bloq.map(x => `<button class="estado bad" style="border:0;text-align:left" data-act="passo" data-n="${x.passo}">${ic('i-alerta')}<span>${esc(x.txt)}<small>Obrigatório · toque para corrigir</small></span></button>`).join('')}
      ${p.avisos.map(x => `<button class="estado ${x.forte ? 'bad' : 'warn'}" style="border:0;text-align:left" data-act="passo" data-n="${x.passo}">${ic('i-alerta')}<span>${esc(x.txt)}<small>Toque para ajustar, ou envie assim</small></span></button>`).join('')}</section>`;
  } else html += `<div class="estado ok">${ic('i-check')}<span>Tudo preenchido</span></div>`;
  html += `<section class="cartao resumo">
    <div class="resumo-linha"><span>Clima</span><b>${esc(clima)}</b></div>
    <div class="resumo-linha"><span>Efetivo</span><b class="num">${pres} presente${pres === 1 ? '' : 's'} · ${ativos.length - pres} falta${ativos.length - pres === 1 ? '' : 's'}</b></div>
    ${movs.length ? `<div class="resumo-linha"><span>Movimentação</span><b>${movs.map(c => esc(c.nome.split(' ')[0]) + (c.saida ? ' (saiu)' : c.novo ? ' (novo)' : ' (chegou)')).join(', ')}</b></div>` : ''}
    <div class="resumo-linha"><span>Serviços</span><b>${serv.length ? serv.map(s => `${esc(s.nome)}: ${s.anterior}→${s.percentual}%`).join('<br>') : 'nenhum atualizado'}</b></div>
    <div class="resumo-linha"><span>Fotos</span><b class="num">${rd.fotos.length}</b></div>
    <div class="resumo-linha"><span>Ocorrências</span><b>${rd.ocorrencias.trim() ? esc(rd.ocorrencias.trim().slice(0, 140)) + (rd.ocorrencias.trim().length > 140 ? '…' : '') : (rd.semOcorrencias ? 'sem ocorrências' : '—')}</b></div>
  </section>`;
  if (rd.fotos.length) html += `<div class="tira">${rd.fotos.map(f => `<img data-foto="${f.id}" alt="">`).join('')}</div>`;
  html += `<p class="mudo" style="margin:0">Ao enviar, o diário fica guardado no celular e sobe sozinho quando houver sinal. Na Vobi ele entra como <b>Concluído</b>, com número automático.</p>
    <button class="btn perigo" data-act="descartar">${ic('i-lixo', 18)} Descartar rascunho</button>`;
  return html;
}

/* =====================================================================

function abrirSheet(tipo, dados) { S.sheet = Object.assign({ tipo }, dados || {}); history.pushState({ sheet: true }, ''); renderSheet(); }
function fecharSheet(viaHistorico) {
  if (!S.sheet) return;
  S.sheet = null; renderSheet();
  if (!viaHistorico) { S.ignorarPop = true; history.back(); }
}

function renderSheet() {
  const el = $('#sheet');
  if (!S.sheet) { el.hidden = true; el.innerHTML = ''; return; }
  const f = { pessoa: folhaPessoa, cadastro: folhaCadastro, saida: folhaSaida, trazer: folhaTrazer, servico: folhaServico, outraData: folhaOutraData, confirmar: folhaConfirmar, descartar: folhaDescartar, descartarInicio: folhaDescartarInicio, corte: folhaCorte }[S.sheet.tipo];
  el.innerHTML = `<div class="folha" role="dialog" aria-modal="true"><div class="folha-alca"></div>${f(S.sheet)}</div>`;
  el.hidden = false;
  const foco = el.querySelector('[data-foco]'); if (foco) setTimeout(() => { if (!el.contains(document.activeElement)) foco.focus(); }, 50);   // não rouba o foco de quem já começou a digitar
  hidratarFotos();
}
const cab = t => `<div class="folha-topo"><h2>${t}</h2><button class="btn-icone" data-act="fecharSheet" aria-label="Fechar">${ic('i-x')}</button></div>`;

function folhaPessoa(sh) {
  const c = S.rd.equipe[sh.i];
  const v = Object.assign({}, c, c.atualizacao || {});
  const telLink = t => String(t || '').replace(/[^\d+]/g, '');
  return cab(esc(c.nome)) + `<div class="mudo">${esc([v.funcao, v.telefone].filter(Boolean).join(' · '))}${v.alojado ? ' · alojado' + (v.alojamento ? ' em ' + esc(v.alojamento) : '') : ''}</div>
    ${v.telEmergencia ? `<a class="estado bad" style="text-decoration:none" href="tel:${esc(telLink(v.telEmergencia))}">${ic('i-alerta')}<span>Emergência: ${esc(v.telEmergencia)}<small>${esc(v.contatoEmergencia || 'Toque para ligar')}</small></span></a>` : ''}
    <div class="lista-sel">
      <button class="item-sel" data-act="abrirSaida" data-i="${sh.i}">${ic('i-seta')}<span class="cresce">Saiu da obra<small>Transferência para outra obra, fim do serviço, demissão…</small></span></button>
      <button class="item-sel" data-act="abrirEditar" data-i="${sh.i}">${ic('i-pessoas')}<span class="cresce">${c.novo ? 'Corrigir cadastro' : 'Atualizar cadastro'}<small>Telefone, emergência, documento, função, alojamento</small></span></button>
      ${(c.novo || c.chegada) ? `<button class="item-sel" data-act="removerPessoa" data-i="${sh.i}">${ic('i-lixo')}<span class="cresce">Tirar da lista<small>Lançado por engano neste diário</small></span></button>` : ''}
    </div>`;
}

function campo(id, rot, valor, extra) {
  extra = extra || {};
  return `<div class="campo"><label for="${id}">${rot}${extra.obrig ? ' *' : ''}</label>

}

function blocoVinculo(v) {
  const tv = tipoVinculo(v.vinculo), legado = v.vinculo && !tv;

function folhaCadastro(sh) {
  const b = S.boot || {};

    (editandoExistente ? `<div class="mudo"><b>${esc(c.nome)}</b></div>` : campo('fNome', 'Nome completo', v.nome, { obrig: true, attrs: 'data-foco autocomplete="off" autocapitalize="words"' })) +

      <input type="text" id="fFuncaoOutra" placeholder="Qual função?" value="${outraFuncao ? esc(v.funcao) : ''}" ${outraFuncao ? '' : 'hidden'}><span class="erro" id="fFuncao-erro" hidden></span></div>` +
    (editandoExistente ? '' : campo('fInicio', 'Na obra desde', v.inicio, { obrig: true, tipo: 'date', attrs: `max="${S.rd.data}"` })) +
    campo('fTel', 'Telefone', v.telefone, { tipo: 'tel', attrs: 'inputmode="tel" autocomplete="off" placeholder="(81) 9 9999-9999"', dica: 'Se não souber agora, pode deixar em branco: o cadastro fica marcado como incompleto.' }) +
    `<div class="grade-2">${campo('fTelEmerg', 'Telefone de emergência', v.telEmergencia, { tipo: 'tel', attrs: 'inputmode="tel" autocomplete="off" placeholder="(81) 9 9999-9999"' })}
      ${campo('fContEmerg', 'De quem é', v.contatoEmergencia, { attrs: 'autocomplete="off" placeholder="Ex.: Maria, esposa"' })}</div>` +
    campo('fDoc', 'Documento (CPF ou RG)', v.documento, { attrs: 'autocomplete="off"', dica: 'Se ele não estiver com o documento agora, pode deixar em branco: o cadastro fica marcado como incompleto até alguém completar. Fica só na base interna, não vai para a Vobi.' }) +
    blocoVinculo(v) +
    `<div class="campo"><span class="rotulo-campo">Está alojado? *</span><div class="chips" id="fAlojado">
      <button class="chip" data-act="selAlojado" data-v="1" aria-pressed="${v.alojado === true}">Sim</button>

function erroCampo(id, msg) {
  const e = document.getElementById(id + '-erro'), inp = document.getElementById(id);
  if (e) { e.textContent = msg || ''; e.hidden = !msg; }
  if (inp) inp.classList.toggle('invalido', !!msg);
  return !msg;
}

function salvarCadastro() {
  const sh = S.sheet;
  const existente = sh.i !== undefined ? S.rd.equipe[sh.i] : null;
  const val = id => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');
  let funcao = val('fFuncao'); if (funcao === '__outra') funcao = val('fFuncaoOutra');
  const d = {
    nome: existente && !existente.novo ? existente.nome : val('fNome'), funcao, inicio: existente && !existente.novo ? existente.inicio : val('fInicio'),
    telefone: val('fTel'), documento: val('fDoc'), telEmergencia: val('fTelEmerg'), contatoEmergencia: val('fContEmerg'), vinculo: sh.vinculo !== undefined ? sh.vinculo : (existente ? (existente.atualizacao && existente.atualizacao.vinculo) || existente.vinculo : ''),
    empresa: val('fEmpreit') === '__novo' ? val('fEmpreitNovo') : val('fEmpreit'),
    valorDiaria: valorNum(val('fDiaria')) ? String(valorNum(val('fDiaria'))) : '',
    custoPor: sh.custo !== undefined ? sh.custo : (existente ? ((existente.atualizacao && existente.atualizacao.custoPor) || existente.custoPor || '') : ''),
    alojado: sh.alojado !== undefined ? sh.alojado : (existente ? existente.alojado : null), alojamento: val('fAloj')
  };
  // apagar o documento de quem já tinha não vale: mantém o que estava
  if (existente && !existente.novo && !d.documento && existente.documento) d.documento = existente.documento;
  if (existente && !existente.novo && !d.telefone && existente.telefone) d.telefone = existente.telefone;
  if (existente && !existente.novo && !d.telEmergencia && existente.telEmergencia) d.telEmergencia = existente.telEmergencia;
  if (existente && !existente.novo && !d.contatoEmergencia && existente.contatoEmergencia) d.contatoEmergencia = existente.contatoEmergencia;
  if (existente && !existente.novo && tipoVinculo(d.vinculo) === 'diarista' && !val('fDiaria') && existente.valorDiaria && d.vinculo === existente.vinculo) d.valorDiaria = existente.valorDiaria;
  let ok = true;
  if (!existente || existente.novo) {
    ok = erroCampo('fNome', d.nome.split(/\s+/).length < 2 ? 'Informe nome e sobrenome.' : '') && ok;
    ok = erroCampo('fInicio', !d.inicio ? 'Informe a data.' : (d.inicio > S.rd.data ? 'Não pode ser depois da data do diário.' : '')) && ok;
  }
  // cadastro novo: tudo obrigatório. Cadastro existente: confere só o que foi alterado.
  const mudou = k => !existente || existente.novo || String(d[k] === undefined || d[k] === null ? '' : d[k]) !== String(existente[k] === undefined || existente[k] === null ? '' : existente[k]);
  if (mudou('funcao')) ok = erroCampo('fFuncao', !d.funcao ? 'Escolha a função.' : '') && ok;
  if (mudou('telefone')) ok = erroCampo('fTel', d.telefone && d.telefone.replace(/\D/g, '').length < 10 ? 'Telefone com DDD (10 ou 11 dígitos), ou deixe em branco.' : '') && ok;
  if (mudou('telEmergencia')) ok = erroCampo('fTelEmerg', d.telEmergencia && d.telEmergencia.replace(/\D/g, '').length < 10 ? 'Telefone com DDD (10 ou 11 dígitos), ou deixe em branco.' : '') && ok;
  if (mudou('documento')) ok = erroCampo('fDoc', d.documento && d.documento.replace(/[^0-9A-Za-z]/g, '').length < 5 ? 'Documento incompleto. Corrija ou deixe em branco.' : '') && ok;
  const tvd = tipoVinculo(d.vinculo);
  if (mudou('vinculo')) ok = erroCampo('fVinculo', !tvd ? 'Escolha o vínculo.' : '') && ok;
  if (tvd === 'diarista' && (mudou('vinculo') || mudou('valorDiaria'))) {
    const bruto = val('fDiaria');
    ok = erroCampo('fDiaria', !bruto ? 'Informe o valor combinado da diária.' : (!valorNum(bruto) ? 'Valor inválido. Ex.: 120,00' : '')) && ok;
  }
  if (tvd === 'empreiteiro' && (mudou('vinculo') || mudou('empresa'))) ok = erroCampo('fEmpreit', !d.empresa ? 'Escolha o empreiteiro responsável.' : '') && ok;
  if (tvd === 'empreiteiro' && (mudou('vinculo') || mudou('custoPor'))) ok = erroCampo('fCusto', !['Rijo', 'Empreiteiro'].includes(d.custoPor) ? 'Diga por conta de quem é o custo.' : '') && ok;
  // mesmo nome de quem já está cadastrado: avisa para não duplicar (homônimo segue tocando Salvar de novo)
  if (!existente) {
    const chave = normNome(d.nome);
    const todos = [...S.rd.equipe, ...((S.boot && S.boot.outrosColaboradores) || []), ...((S.boot && S.boot.obras) || []).flatMap(o => o.equipe || [])];
    const dup = todos.find(x => normNome(x.nome) === chave);
    if (dup && sh.homonimo !== chave) {
      sh.homonimo = chave;
      ok = erroCampo('fNome', `Já existe ${dup.nome} no cadastro${dup.obraAtual ? ' (obra ' + dup.obraAtual + ')' : ''}. Se for a mesma pessoa, use "Trazer de outra obra" para não duplicar. Se for outra pessoa com o mesmo nome, toque em Salvar de novo.`) && ok;
    }
  }
  if (mudou('alojado')) ok = erroCampo('fAlojado', d.alojado === null || d.alojado === undefined ? 'Informe se está alojado.' : '') && ok;
  if (d.alojado && (mudou('alojado') || mudou('alojamento'))) ok = erroCampo('fAloj', !d.alojamento ? 'Informe o alojamento.' : '') && ok;
  if (!ok) { const e = document.querySelector('.folha .erro:not([hidden])'); if (e) e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (!d.alojado) d.alojamento = '';
  if (tvd !== 'diarista') d.valorDiaria = '';
  if (tvd !== 'empreiteiro') { d.empresa = ''; d.custoPor = ''; }
  if (!existente) {
    S.rd.equipe.push(Object.assign({ id: uuid(), novo: true, presente: true, motivoFalta: '' }, d));
    S.rd.equipe.sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
    const falta = faltasCad(d);
    toast(falta.length ? `${d.nome.split(' ')[0]} cadastrado sem ${falta.join(' e ')}: cadastro incompleto.` : `${d.nome.split(' ')[0]} cadastrado e marcado presente.`);
  } else if (existente.novo) {
    Object.assign(existente, d);
  } else {
    const mud = {};
    ['funcao', 'telefone', 'documento', 'telEmergencia', 'contatoEmergencia', 'vinculo', 'empresa', 'valorDiaria', 'custoPor', 'alojado', 'alojamento'].forEach(k => {
      if (String(d[k] === undefined ? '' : d[k]) !== String(existente[k] === undefined ? '' : existente[k])) mud[k] = d[k];
    });
    existente.atualizacao = Object.keys(mud).length ? mud : null;
    toast(Object.keys(mud).length ? 'Cadastro atualizado.' : 'Nada mudou.');
  }
  S.rd.equipeConferida = true;
  salvarRd(); fecharSheet(); render();
}

function salvarSaida() {
  const sh = S.sheet;
  const c = S.rd.equipe[sh.i];
  const data = document.getElementById('fDataSaida').value;
  const destino = document.getElementById('fDestino') ? document.getElementById('fDestino').value : '';
  let ok = erroCampo('fMotivo', !sh.motivo ? 'Escolha o motivo.' : '');
  ok = erroCampo('fDataSaida', !data ? 'Informe a data.' : '') && ok;
  if (sh.motivo === 'transferencia') ok = erroCampo('fDestino', !destino ? 'Escolha a obra de destino.' : '') && ok;
  if (!ok) return;
  c.saida = { data, motivo: sh.motivo, obraDestino: sh.motivo === 'transferencia' ? destino : '', detalhe: document.getElementById('fDetalhe').value.trim() };
  S.rd.equipeConferida = true;
  salvarRd(); fecharSheet(); render();
  toast(`Saída de ${c.nome.split(' ')[0]} registrada.`);
}

   EVENTOS

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (ev.target.id === 'sheet' && !(S.sheet && S.sheet.tipo === 'corte')) fecharSheet(); return; }
  const a = el.dataset.act, i = el.dataset.i !== undefined ? Number(el.dataset.i) : null, v = el.dataset.v;
  const rd = S.rd;
  switch (a) {
    case 'entrar': {
      const txt = $('#inpLink').value.trim();
      const m = txt.match(/[?&]t=([A-Za-z0-9_\-]+)/);
      const tok = m ? m[1] : txt;
      if (tok.length < 20) { S.msgAcesso = 'Esse não parece ser o link completo. Copie a mensagem inteira do escritório.'; render(); return; }
      await entrouComToken(tok);
      return;
    }
    case 'escolherNome': AC.nome = v; AC.msg = ''; S.msgAcesso = ''; render(); window.scrollTo(0, 0); setTimeout(() => { const el = $('#inpDig'); if (el) el.focus(); }, 50); return;
    case 'trocarNome': AC.nome = null; AC.msg = ''; render(); window.scrollTo(0, 0); return;
    case 'recarregarAcesso': carregarAcesso(); return;
    case 'confirmarEntrada': {
      const dig = ($('#inpDig').value || '').replace(/\D/g, '');
      if (dig.length !== 4) { AC.msg = 'Digite os 4 últimos números do seu celular.'; render(); return; }
      AC.enviando = true; AC.msg = ''; render();
      try {
        const r = await api('entrar', { nome: AC.nome, digitos: dig }, 30000);
        AC.enviando = false;
        if (!r.ok) { AC.msg = r.erro; render(); return; }
        await entrouComToken(r.token);
      } catch (e) { AC.enviando = false; AC.msg = e.message; render(); }
      return;
    }
    case 'sairConta': await sairDaConta(); return;
    case 'fila': S.tela = 'fila'; history.pushState({ tela: 'fila' }, ''); render(); window.scrollTo(0, 0); return;
    case 'inicio': history.back(); return;
    case 'atualizar': await atualizarBoot(); if (!S.online) toast('Sem conexão. Usando os dados guardados no celular.'); return;
    case 'sincronizar': sincronizar(); return;
    case 'abrir': abrirDiario(el.dataset.obra, el.dataset.data); return;
    case 'outraData': abrirSheet('outraData', { obra: el.dataset.obra }); return;
    case 'abrirOutraData': {
      const d = $('#fOutraData').value;
      const max = (S.boot && S.boot.config && S.boot.config.maxDiasAtras) || 45;
      if (!d || d > hoje() || d < somaDias(hoje(), -max)) { erroCampo('fOutraData', `Escolha uma data entre ${br(somaDias(hoje(), -max))} e hoje.`); return; }
      const obra = S.sheet.obra; S.sheet = null; renderSheet(); abrirDiario(obra, d, true); return;
    }
    case 'descartarItem': {
      const it = S.fila.find(x => x.id === el.dataset.id);
      if (it) { it.estado = 'descartado'; await salvarItem(it); for (const f of it.fotos) await apagarFoto(f.id); render(); }
      return;
    }
    case 'sair': history.back(); return;
    case 'passo': irPasso(Number(el.dataset.n)); return;
    case 'proximo': if (S.passo === 1) rd.equipeConferida = true; irPasso(S.passo + 1); return;
    case 'tempo': rd.clima[el.dataset.p].weather = v; rd.clima[el.dataset.p].checked = true; rd.clima[el.dataset.p].sugerido = false; salvarRd(); render(); return;
    case 'condicao': rd.clima[el.dataset.p].status = v; rd.clima[el.dataset.p].checked = true; salvarRd(); render(); return;
    case 'presenca': rd.equipe[i].presente = v === '1'; if (v === '0' && !rd.equipe[i].motivoFalta) rd.equipe[i].motivoFalta = 'Falta'; rd.equipeConferida = true; salvarRd(); render(); return;
    case 'motivo': rd.equipe[i].motivoFalta = v; salvarRd(); render(); return;
    case 'todosPresentes': rd.equipe.forEach(c => { c.presente = true; }); rd.equipeConferida = true; salvarRd(); render(); return;
    case 'menuPessoa': abrirSheet('pessoa', { i }); return;
    case 'abrirSaida': S.sheet = { tipo: 'saida', i }; renderSheet(); return;
    case 'abrirEditar': S.sheet = { tipo: 'cadastro', i }; renderSheet(); return;
    case 'removerPessoa': rd.equipe.splice(i, 1); salvarRd(); fecharSheet(); render(); return;
    case 'desfazerSaida': delete rd.equipe[i].saida; salvarRd(); render(); return;
    case 'novoColab': abrirSheet('cadastro', {}); return;
    case 'trazer': abrirSheet('trazer', { q: '' }); return;
    case 'selTrazer': S.sheet.sel = v; renderSheet(); return;
    case 'salvarTrazer': {
      const c = (S.boot.outrosColaboradores || []).find(x => x.id === S.sheet.sel);
      const ini = $('#fInicioTrazer').value || rd.data;
      if (ini > rd.data) { erroCampo('fInicioTrazer', 'Não pode ser depois da data do diário.'); return; }
      rd.equipe.push({ id: c.id, nome: c.nome, funcao: c.funcao, inicio: ini, chegada: true, presente: true, motivoFalta: '',
        vinculo: c.vinculo || '', empresa: c.empresa || '', valorDiaria: c.valorDiaria || '', custoPor: c.custoPor || '', faltas: c.faltas || [] });
      rd.equipe.sort((x, y) => String(x.nome).localeCompare(String(y.nome)));
      rd.equipeConferida = true; salvarRd(); fecharSheet(); render(); toast(`${c.nome.split(' ')[0]} incluído na equipe.`);
      return;
    }
    case 'selVinculo': {
      S.sheet.vinculo = v;
      document.querySelectorAll('#fVinculo .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
      const tv = tipoVinculo(v), def = (vinculosLista().find(x => x.nome === v) || {}).custo;
      $('#boxDiaria').hidden = tv !== 'diarista'; $('#boxEmpreit').hidden = tv !== 'empreiteiro';

      }
      if (tv === 'diarista') setTimeout(() => { const el = $('#fDiaria'); if (el && !el.value) el.focus(); }, 50);
      return;
    }
    case 'selCusto': S.sheet.custo = v; document.querySelectorAll('#fCusto .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return;
    case 'selAlojado': S.sheet.alojado = v === '1'; document.querySelectorAll('#fAlojado .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); $('#boxAloj').hidden = v !== '1'; return;
    case 'salvarCadastro': salvarCadastro(); return;

      S.sheet.motivo = v; S.sheet.data = $('#fDataSaida').value; S.sheet.detalhe = $('#fDetalhe').value;
      S.sheet.destino = $('#fDestino') ? $('#fDestino').value : ''; renderSheet(); return;
    }
    case 'salvarSaida': salvarSaida(); return;
    case 'pctMenos': case 'pctMais': {
      const s = rd.servicos[i];
      s.percentual = Math.max(0, Math.min(100, s.percentual + (a === 'pctMais' ? 5 : -5)));
      if (s.percentual !== s.anterior) s.trabalhou = true;
      salvarRd(); render(); return;
    }
    case 'novoServico': abrirSheet('servico'); return;
    case 'salvarServico': {
      const nome = $('#fServNome').value.trim();

    case 'camera': S.fotoGeral = false; $('#inpCamera').click(); return;
    case 'galeria': S.fotoGeral = false; $('#inpGaleria').click(); return;
    case 'cameraGeral': S.fotoGeral = true; $('#inpCamera').click(); return;

      const t = $('#txtOcorr');

    case 'enviar': {
      const p = pendencias(rd);
      if (p.bloq.length) { irPasso(p.bloq[0].passo); return; }
      if (p.avisos.length) { abrirSheet('confirmar'); return; }

    case 'enviarConfirmado': fecharSheet(); enviarDiario(); return;
    case 'descartar': abrirSheet('descartar'); return;

      const r0 = await DB.get('rascunhos', el.dataset.obra + '|' + el.dataset.data);

    case 'posCorte': S.sheet.pos = v; renderSheet(); return;
    case 'corteUsar': concluirCorte(true); return;
    case 'corteDescartar': concluirCorte(false); return;
    case 'gpsDeNovo': GPS.erro = ''; pararGPS(); iniciarGPS(); atualizarGpsUI(); return;

});

document.addEventListener('input', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  const rd = S.rd, i = el.dataset.i !== undefined ? Number(el.dataset.i) : null;
  switch (b) {
    case 'pct': {
      const s = rd.servicos[i]; s.percentual = Number(el.value);

      const cb = document.querySelector(`[data-bind="trabalhou"][data-i="${i}"]`); if (cb) cb.checked = s.trabalhou;
      salvarRd(); return;
    }
    case 'obsServ': rd.servicos[i].obs = el.value; salvarRd(); return;
    case 'legenda': rd.fotos[i].legenda = el.value; salvarRd(); return;

});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'inpCamera' || el.id === 'inpGaleria') { const fs = [...el.files]; el.value = ''; processarArquivos(fs, el.id === 'inpCamera' ? 'camera' : 'galeria'); return; }

  if (!b) return;
  switch (b) {
    case 'climaCheck': rd.clima[el.dataset.p].checked = el.checked; salvarRd(); render(); return;
    case 'trabalhou': rd.servicos[i].trabalhou = el.checked; salvarRd(); return;

});

window.addEventListener('popstate', () => {
  if (S.ignorarPop) { S.ignorarPop = false; return; }
  if (S.sheet) { fecharSheet(true); return; }
  if (S.tela === 'diario') { salvarRd(true); pararGPS(); S.rd = null; S.tela = 'inicio'; render(); window.scrollTo(0, 0); return; }
  if (S.tela === 'fila') { S.tela = 'inicio'; render(); return; }
});

/* ---------- avisos ---------- */
let timerToast = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(timerToast); timerToast = setTimeout(() => { t.hidden = true; }, 3800);
}
function ocupado(msg) {
  let el = document.getElementById('ocupado');
  if (!msg) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'ocupado'; el.className = 'ocupado'; document.body.appendChild(el); }
  el.textContent = msg;
}

async function iniciar() {
  const p = new URLSearchParams(location.search);
  const t = p.get('t');
  if (t && t.length >= 20) await salvarToken(t);
  S.token = (await DB.get('kv', 'token')) || lsGet('rdo_token');
  if (DEMO && !S.token) S.token = 'demo-token-engenheiro-exemplo-0001';
  S.boot = (await DB.get('kv', 'boot')) || null;
  S.ultimaSync = (await DB.get('kv', 'ultimaSync')) || null;
  S.fila = (await DB.all('fila')) || [];
  ((await DB.all('rascunhos')) || []).forEach(r => { S.rascunhos[r.obra + '|' + r.data] = true; });
  history.replaceState({ tela: 'inicio' }, '');
  if (!S.token) { S.tela = 'acesso'; render(); carregarAcesso(); return; }
  S.tela = 'inicio'; render();
  iniciarSessao();
}

  if (_sessao) return;

}
