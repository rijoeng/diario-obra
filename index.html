function erroCampo(id, msg) {
  const e = document.getElementById(id + '-erro'), inp = document.getElementById(id);
  if (e) { e.textContent = msg || ''; e.hidden = !msg; }
  if (inp) inp.classList.toggle('invalido', !!msg);
  return !msg;
}

function salvarCadastro() {
  const sh = S.sheet;
  const existente = sh.i !== undefined ? S.rd.equipe[sh.i] : null;
  const val = id => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');
  let funcao = val('fFuncao'); if (funcao === '__outra') funcao = val('fFuncaoOutra');
  const d = {
    nome: existente && !existente.novo ? existente.nome : val('fNome'), funcao, inicio: existente && !existente.novo ? existente.inicio : val('fInicio'),
    telefone: val('fTel'), documento: val('fDoc'), vinculo: sh.vinculo !== undefined ? sh.vinculo : (existente ? (existente.atualizacao && existente.atualizacao.vinculo) || existente.vinculo : ''),
    empresa: val('fEmpresa'), alojado: sh.alojado !== undefined ? sh.alojado : (existente ? existente.alojado : null), alojamento: val('fAloj')
  };
  let ok = true;
  if (!existente || existente.novo) {
    ok = erroCampo('fNome', d.nome.split(/\s+/).length < 2 ? 'Informe nome e sobrenome.' : '') && ok;
    ok = erroCampo('fInicio', !d.inicio ? 'Informe a data.' : (d.inicio > S.rd.data ? 'Não pode ser depois da data do diário.' : '')) && ok;
  }
  // cadastro novo: tudo obrigatório. Cadastro existente: confere só o que foi alterado.
  const mudou = k => !existente || existente.novo || String(d[k] === undefined || d[k] === null ? '' : d[k]) !== String(existente[k] === undefined || existente[k] === null ? '' : existente[k]);
  if (mudou('funcao')) ok = erroCampo('fFuncao', !d.funcao ? 'Escolha a função.' : '') && ok;
  if (mudou('telefone')) ok = erroCampo('fTel', d.telefone.replace(/\D/g, '').length < 10 ? 'Telefone com DDD (10 ou 11 dígitos).' : '') && ok;
  if (mudou('documento')) ok = erroCampo('fDoc', d.documento.replace(/\W/g, '').length < 5 ? 'Informe o CPF ou RG.' : '') && ok;
  if (mudou('vinculo')) ok = erroCampo('fVinculo', !d.vinculo ? 'Escolha o vínculo.' : '') && ok;
  if (mudou('alojado')) ok = erroCampo('fAlojado', d.alojado === null || d.alojado === undefined ? 'Informe se está alojado.' : '') && ok;
  if (d.alojado && (mudou('alojado') || mudou('alojamento'))) ok = erroCampo('fAloj', !d.alojamento ? 'Informe o alojamento.' : '') && ok;
  if (!ok) { const e = document.querySelector('.folha .erro:not([hidden])'); if (e) e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (!d.alojado) d.alojamento = '';
  if (!['Empreiteiro', 'Outro'].includes(d.vinculo)) d.empresa = '';
  if (!existente) {
    S.rd.equipe.push(Object.assign({ id: uuid(), novo: true, presente: true, motivoFalta: '' }, d));
    S.rd.equipe.sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
    toast(`${d.nome.split(' ')[0]} cadastrado e marcado presente.`);
  } else if (existente.novo) {
    Object.assign(existente, d);
  } else {
    const mud = {};
    ['funcao', 'telefone', 'documento', 'vinculo', 'empresa', 'alojado', 'alojamento'].forEach(k => {
      if (String(d[k] === undefined ? '' : d[k]) !== String(existente[k] === undefined ? '' : existente[k])) mud[k] = d[k];
    });
    existente.atualizacao = Object.keys(mud).length ? mud : null;
    toast(Object.keys(mud).length ? 'Cadastro atualizado.' : 'Nada mudou.');
  }
  S.rd.equipeConferida = true;
  salvarRd(); fecharSheet(); render();
}

function salvarSaida() {
  const sh = S.sheet;
  const c = S.rd.equipe[sh.i];
  const data = document.getElementById('fDataSaida').value;
  const destino = document.getElementById('fDestino') ? document.getElementById('fDestino').value : '';
  let ok = erroCampo('fMotivo', !sh.motivo ? 'Escolha o motivo.' : '');
  ok = erroCampo('fDataSaida', !data ? 'Informe a data.' : '') && ok;
  if (sh.motivo === 'transferencia') ok = erroCampo('fDestino', !destino ? 'Escolha a obra de destino.' : '') && ok;
  if (!ok) return;
  c.saida = { data, motivo: sh.motivo, obraDestino: sh.motivo === 'transferencia' ? destino : '', detalhe: document.getElementById('fDetalhe').value.trim() };
  S.rd.equipeConferida = true;
  salvarRd(); fecharSheet(); render();
  toast(`Saída de ${c.nome.split(' ')[0]} registrada.`);
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (ev.target.id === 'sheet' && !(S.sheet && S.sheet.tipo === 'corte')) fecharSheet(); return; }
  const a = el.dataset.act, i = el.dataset.i !== undefined ? Number(el.dataset.i) : null, v = el.dataset.v;
  const rd = S.rd;
  switch (a) {
    case 'entrar': {
      const txt = $('#inpLink').value.trim();
      const m = txt.match(/[?&]t=([A-Za-z0-9_\-]+)/);
      const tok = m ? m[1] : txt;
      if (tok.length < 20) { S.msgAcesso = 'Esse não parece ser o link completo. Copie a mensagem inteira do escritório.'; render(); return; }
      await salvarToken(tok); S.msgAcesso = ''; S.tela = 'inicio'; render();
      await atualizarBoot(); sincronizar();
      return;
    }
    case 'fila': S.tela = 'fila'; history.pushState({ tela: 'fila' }, ''); render(); window.scrollTo(0, 0); return;
    case 'inicio': history.back(); return;
    case 'atualizar': await atualizarBoot(); if (!S.online) toast('Sem conexão. Usando os dados guardados no celular.'); return;
    case 'sincronizar': sincronizar(); return;
    case 'abrir': abrirDiario(el.dataset.obra, el.dataset.data); return;
    case 'outraData': abrirSheet('outraData', { obra: el.dataset.obra }); return;
    case 'abrirOutraData': {
      const d = $('#fOutraData').value;
      const max = (S.boot && S.boot.config && S.boot.config.maxDiasAtras) || 45;
      if (!d || d > hoje() || d < somaDias(hoje(), -max)) { erroCampo('fOutraData', `Escolha uma data entre ${br(somaDias(hoje(), -max))} e hoje.`); return; }
      const obra = S.sheet.obra; S.sheet = null; renderSheet(); abrirDiario(obra, d, true); return;
    }
    case 'descartarItem': {
      const it = S.fila.find(x => x.id === el.dataset.id);
      if (it) { it.estado = 'descartado'; await salvarItem(it); for (const f of it.fotos) await DB.del('fotos', f.id); render(); }
      return;
    }
    case 'sair': history.back(); return;
    case 'passo': irPasso(Number(el.dataset.n)); return;
    case 'proximo': if (S.passo === 1) rd.equipeConferida = true; irPasso(S.passo + 1); return;
    case 'tempo': rd.clima[el.dataset.p].weather = v; rd.clima[el.dataset.p].checked = true; rd.clima[el.dataset.p].sugerido = false; salvarRd(); render(); return;
    case 'condicao': rd.clima[el.dataset.p].status = v; rd.clima[el.dataset.p].checked = true; salvarRd(); render(); return;
    case 'presenca': rd.equipe[i].presente = v === '1'; if (v === '0' && !rd.equipe[i].motivoFalta) rd.equipe[i].motivoFalta = 'Falta'; rd.equipeConferida = true; salvarRd(); render(); return;
    case 'motivo': rd.equipe[i].motivoFalta = v; salvarRd(); render(); return;
    case 'todosPresentes': rd.equipe.forEach(c => { c.presente = true; }); rd.equipeConferida = true; salvarRd(); render(); return;
    case 'menuPessoa': abrirSheet('pessoa', { i }); return;
    case 'abrirSaida': S.sheet = { tipo: 'saida', i }; renderSheet(); return;
    case 'abrirEditar': S.sheet = { tipo: 'cadastro', i }; renderSheet(); return;
    case 'removerPessoa': rd.equipe.splice(i, 1); salvarRd(); fecharSheet(); render(); return;
    case 'desfazerSaida': delete rd.equipe[i].saida; salvarRd(); render(); return;
    case 'novoColab': abrirSheet('cadastro', {}); return;
    case 'trazer': abrirSheet('trazer', { q: '' }); return;
    case 'selTrazer': S.sheet.sel = v; renderSheet(); return;
    case 'salvarTrazer': {
      const c = (S.boot.outrosColaboradores || []).find(x => x.id === S.sheet.sel);
      const ini = $('#fInicioTrazer').value || rd.data;
      if (ini > rd.data) { erroCampo('fInicioTrazer', 'Não pode ser depois da data do diário.'); return; }
      rd.equipe.push({ id: c.id, nome: c.nome, funcao: c.funcao, inicio: ini, chegada: true, presente: true, motivoFalta: '' });
      rd.equipe.sort((x, y) => String(x.nome).localeCompare(String(y.nome)));
      rd.equipeConferida = true; salvarRd(); fecharSheet(); render(); toast(`${c.nome.split(' ')[0]} incluído na equipe.`);
      return;
    }
    case 'selVinculo': S.sheet.vinculo = v; document.querySelectorAll('#fVinculo .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); $('#boxEmpresa').hidden = !['Empreiteiro', 'Outro'].includes(v); return;
    case 'selAlojado': S.sheet.alojado = v === '1'; document.querySelectorAll('#fAlojado .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); $('#boxAloj').hidden = v !== '1'; return;
    case 'salvarCadastro': salvarCadastro(); return;
    case 'selMotivoSaida': {
      S.sheet.motivo = v; S.sheet.data = $('#fDataSaida').value; S.sheet.detalhe = $('#fDetalhe').value;
      S.sheet.destino = $('#fDestino') ? $('#fDestino').value : ''; renderSheet(); return;
    }
    case 'salvarSaida': salvarSaida(); return;
    case 'pctMenos': case 'pctMais': {
      const s = rd.servicos[i];
      s.percentual = Math.max(0, Math.min(100, s.percentual + (a === 'pctMais' ? 5 : -5)));
      if (s.percentual !== s.anterior) s.trabalhou = true;
      salvarRd(); render(); return;
    }
    case 'novoServico': abrirSheet('servico'); return;
    case 'salvarServico': {
      const nome = $('#fServNome').value.trim();
      const pct = Math.max(0, Math.min(100, Math.round(Number($('#fServPct').value.replace(',', '.')) || 0)));
      if (!erroCampo('fServNome', nome.length < 3 ? 'Dê um nome ao serviço.' : '')) return;
      rd.servicos.push({ id: uuid(), nome, anterior: 0, percentual: pct, obs: '', trabalhou: true, novo: true });
      salvarRd(); fecharSheet(); render(); return;
    }
    case 'camera': $('#inpCamera').click(); return;
    case 'galeria': $('#inpGaleria').click(); return;
    case 'rmFoto': { const f = rd.fotos.splice(i, 1)[0]; await DB.del('fotos', f.id); liberarUrl(f.id); salvarRd(); render(); return; }
    case 'atalho': {
      const t = $('#txtOcorr');
      const base = rd.ocorrencias.replace(/\s+$/, '');
      rd.ocorrencias = (base ? base + '\n' : '') + v + ': ';
      rd.semOcorrencias = false; salvarRd();
      t.value = rd.ocorrencias; t.focus(); t.setSelectionRange(t.value.length, t.value.length);
      const cb = document.querySelector('[data-bind="semOcorr"]'); if (cb) cb.checked = false;
      return;
    }
    case 'enviar': {
      const p = pendencias(rd);
      if (p.bloq.length) { irPasso(p.bloq[0].passo); return; }
      if (p.avisos.length) { abrirSheet('confirmar'); return; }
      enviarDiario(); return;
    }
    case 'enviarConfirmado': fecharSheet(); enviarDiario(); return;
    case 'descartar': abrirSheet('descartar'); return;
    case 'descartarConfirmado': descartarRascunho(); return;
    case 'fecharSheet': if (S.sheet && S.sheet.tipo === 'corte') { concluirCorte(false); return; } fecharSheet(); return;
    case 'posCorte': S.sheet.pos = v; renderSheet(); return;
    case 'corteUsar': concluirCorte(true); return;
    case 'corteDescartar': concluirCorte(false); return;
    case 'gpsDeNovo': GPS.erro = ''; pararGPS(); iniciarGPS(); atualizarGpsUI(); return;
  }
});

document.addEventListener('input', ev => {
  const el = ev.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  const rd = S.rd, i = el.dataset.i !== undefined ? Number(el.dataset.i) : null;
  switch (b) {
    case 'pct': {
      const s = rd.servicos[i]; s.percentual = Number(el.value);

    const servicos = [['Fundação · sapatas e baldrame', 100], ['Alvenaria do térreo', 45], ['Laje do térreo · forma e armação', 30], ['Instalações elétricas · tubulação', 20], ['Reboco interno', 0]]
      .map((s, k) => ({ id: 's' + k, obra: 'EX.01', nome: s[0], percentual: s[1], status: s[1] >= 100 ? 'concluido' : 'ativo' }));
    servicos.push({ id: 's10', obra: 'EX.02', nome: 'Estrutura metálica', percentual: 70, status: 'ativo' });
    const diarios = [];
    dias.forEach((d, k) => { if (k !== 1) diarios.push({ obra: 'EX.01', data: d, codigo: pad3(12 - k), status: 'enviado', origem: 'app', engenheiro: 'Eng. Marina Duarte (exemplo)' }); });
    diarios.push({ obra: 'EX.02', data: dias[0], codigo: '031', status: 'enviado', origem: 'vobi' });
    return { pessoas, servicos, diarios, recebidos: {} };
  }
  const pad3 = n => String(n).padStart(3, '0');
  async function carregar() { if (!db) db = (await DB.get('kv', 'demo')) || semente(); return db; }
  async function salvar() { await DB.put('kv', 'demo', db); }
  function previsao() {
    const out = {};
    for (let i = -3; i <= 1; i++) out[somaDias(hoje(), i)] = { morning: { weather: 'clean', status: 'practicable', chuvaMm: 0 }, afternoon: { weather: 'rainy', status: 'practicable', chuvaMm: 3.4 }, night: { weather: 'cloudy', status: 'practicable', chuvaMm: 0.2 } };
    return out;
  }
  async function chamar(acao, d) {
    await espera(250);
    if (S.forcarOffline) throw Object.assign(new Error('Sem conexão com a internet.'), { rede: true });
    const b = await carregar();
    if (acao === 'bootstrap') {
      const obras = [['EX.01', 'EX.01 | Residencial Jardins (exemplo)'], ['EX.02', 'EX.02 | Galpão Logístico (exemplo)']].map(([cod, nome]) => ({
        codigo: cod, nome, idVobi: 0, cidade: 'Recife - PE', envioVobi: false, previsao: previsao(),
        latitude: cod === 'EX.01' ? -8.053920 : -8.110200, longitude: cod === 'EX.01' ? -34.880870 : -34.915000,
        equipe: b.pessoas.filter(p => p.obra === cod && !p.desligado).map(p => Object.assign({}, p)),
        servicos: b.servicos.filter(s => s.obra === cod).map(s => ({ id: s.id, nome: s.nome, percentual: s.percentual, status: s.status })),
        diarios: b.diarios.filter(x => x.obra === cod).sort((x, y) => y.data.localeCompare(x.data))
      }));
      return {
        ok: true, hoje: hoje(), geradoEm: new Date().toISOString(), engenheiro: { nome: 'Eng. Marina Duarte (exemplo)', email: '' }, obras,
        obrasDestino: obras.map(o => ({ codigo: o.codigo, nome: o.nome })).concat([{ codigo: 'EX.03', nome: 'EX.03 | Reforma Clínica (exemplo)' }]),
        outrosColaboradores: b.pessoas.filter(p => p.obra !== 'EX.01' || p.desligado).map(p => ({ id: p.id, nome: p.nome, funcao: p.funcao, obraAtual: p.obra, situacao: p.desligado ? 'desligado' : 'ativo' })),
        funcoes: ['Mestre de obras', 'Encarregado', 'Pedreiro', 'Servente', 'Carpinteiro', 'Armador', 'Eletricista', 'Encanador', 'Pintor', 'Gesseiro'],
        alojamentos: ['Alojamento Rua das Flores (exemplo)', 'Pousada do Canteiro (exemplo)'],
        motivosFalta: ['Falta', 'Atestado médico', 'Folga', 'Férias', 'Chuva / sem frente de serviço', 'Outro'],
        motivosSaida: [{ id: 'transferencia', nome: 'Transferido para outra obra' }, { id: 'fim_servico', nome: 'Fim do serviço (empreiteiro)' }, { id: 'demissao', nome: 'Demitido / fim de contrato' }, { id: 'pediu_demissao', nome: 'Pediu demissão' }, { id: 'abandono', nome: 'Abandono' }, { id: 'outro', nome: 'Outro' }],
        vinculos: ['Rijo (CLT)', 'Empreiteiro', 'Diarista', 'Autônomo', 'Outro'],
        config: { diasTrabalho: [1, 2, 3, 4, 5, 6], minFotos: 1, maxDiasAtras: 45, raioObraM: 1000 }
      };
    }
    if (acao === 'enviarDiario') {
      if (b.recebidos[d.id]) return { ok: true, status: b.recebidos[d.id].status, jaRecebido: true };
      if (b.diarios.some(x => x.obra === d.obra && x.data === d.data)) return { ok: false, codigo: 'duplicado', erro: `Já existe diário de ${br(d.data)} nesta obra.` };
      d.novos.forEach(n => b.pessoas.push(Object.assign({}, n, { obra: d.obra })));
      d.chegadas.forEach(ch => { const p = b.pessoas.find(x => x.id === ch.id); if (p) { p.obra = d.obra; p.inicio = ch.inicio; p.desligado = false; } });
      d.atualizacoes.forEach(a => { const p = b.pessoas.find(x => x.id === a.id); if (p) Object.assign(p, a); });
      d.saidas.forEach(s => { const p = b.pessoas.find(x => x.id === s.id); if (p) { if (s.motivo === 'transferencia') { p.obra = s.obraDestino; p.inicio = s.data; } else { p.obra = ''; p.desligado = true; } } });
      d.servicos.forEach(s => { const x = b.servicos.find(y => y.id === s.id); if (x) { x.percentual = s.percentual; x.status = s.percentual >= 100 ? 'concluido' : 'ativo'; } else b.servicos.push({ id: s.id, obra: d.obra, nome: s.nome, percentual: s.percentual, status: 'ativo' }); });
      const ult = b.diarios.filter(x => x.obra === d.obra).map(x => Number(x.codigo)).reduce((m, x) => Math.max(m, x), 0);
      const reg = { obra: d.obra, data: d.data, codigo: pad3(ult + 1), status: 'enviado', origem: 'app', engenheiro: 'Eng. Marina Duarte (exemplo)' };
      b.diarios.push(reg);
      b.recebidos[d.id] = { status: 'enviado', codigoVobi: reg.codigo, fotosEsperadas: d.fotos.length };
      await salvar();
      return { ok: true, status: d.fotos.length ? 'aguardando-fotos' : 'pronto', avisos: [], envioVobi: true };
    }
    if (acao === 'enviarFoto') { await espera(300); return { ok: true, status: 'pronto' }; }
    if (acao === 'situacao') { const out = {}; (d.ids || []).forEach(id => { if (b.recebidos[id]) out[id] = b.recebidos[id]; }); return { ok: true, diarios: out }; }
    return { ok: false, erro: 'Ação desconhecida' };
  }
  return { chamar };
})();

async function iniciar() {
  const p = new URLSearchParams(location.search);
  const t = p.get('t');
  if (t && t.length >= 20) await salvarToken(t);
  S.token = (await DB.get('kv', 'token')) || lsGet('rdo_token');
  if (DEMO && !S.token) S.token = 'demo-token-engenheiro-exemplo-0001';
  S.boot = (await DB.get('kv', 'boot')) || null;
  S.ultimaSync = (await DB.get('kv', 'ultimaSync')) || null;
  S.fila = (await DB.all('fila')) || [];
  ((await DB.all('rascunhos')) || []).forEach(r => { S.rascunhos[r.obra + '|' + r.data] = true; });
  history.replaceState({ tela: 'inicio' }, '');
  if (!S.token) { S.tela = 'acesso'; render(); return; }
  S.tela = 'inicio'; render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await atualizarBoot();
  sincronizar();
  setInterval(() => { if (!document.hidden) sincronizar(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
  window.addEventListener('online', () => { S.online = true; sincronizar(); });
  window.addEventListener('offline', () => { S.online = false; renderBarra(); });
}

if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
iniciar();
