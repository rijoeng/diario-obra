<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Obra Rijo</title>
<meta name="description" content="Lançamento do diário de obra pelo celular, com ou sem sinal. Integra com a Vobi.">
<meta name="theme-color" content="#0F3D2E">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diário Obra">
<script src="config.js"></script>
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mesma linguagem dos sistemas Rijo (APIs Vobi 01–04): barra institucional verde com a logomarca negativa
   e as etapas como abas; coluna única para uso com uma mão na obra; ação principal sempre no rodapé,
   ao alcance do polegar; alvos de toque grandes e contraste alto para uso no sol. */
:root {
  --verde: #0F3D2E; --verde-2: #3A8F5C; --verde-3: #E3EFE7; --verde-tinta: #1D5C43;
  --fundo: #F2F4F3; --papel: #FFFFFF; --papel-2: #F6F8F7; --linha: #DCE3DF; --linha-forte: #C3CEC8;
  --texto: #1B2A24; --texto-2: #566761; --texto-3: #748580;
  --rec: #2F8552; --ok-fundo: #E3EFE7;
  --cli: #A36A12; --cli-fundo: #F6ECD9;
  --venc: #A9432D; --venc-fundo: #F7E7E3;
  --fun: #2F5E8C; --fun-fundo: #E4EDF6;
  --topo: #0F3D2E; --topo-texto: #FFFFFF; --topo-2: #B9D3C4; --topo-acento: #8CCBA5;
  --pri-texto: #FFFFFF;
  --sombra: 0 1px 2px rgba(15, 61, 46, .06);
  --sombra-2: 0 1px 2px rgba(15, 61, 46, .05), 0 6px 20px rgba(15, 61, 46, .06);
  --fonte: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte-cond: "Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --fonte-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --raio: 12px;
  --tap: 48px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --verde: #8CCBA5; --verde-2: #5DB283; --verde-3: #1F332A; --verde-tinta: #A6D9BA;
    --fundo: #121A17; --papel: #18231F; --papel-2: #1D2925; --linha: #2A3934; --linha-forte: #3A4B45;
    --texto: #E4ECE8; --texto-2: #A7B6B0; --texto-3: #8A9A94;
    --rec: #5DB283; --ok-fundo: #1F332A; --cli: #D8B25E; --cli-fundo: #352D1B;
    --venc: #E08A72; --venc-fundo: #3A2520; --fun: #8DB6E0; --fun-fundo: #1E2C3A;
    --topo: #0B2A20; --topo-texto: #E4ECE8; --topo-2: #8FB9A1; --topo-acento: #8CCBA5;
    --pri-texto: #0B1A14; --sombra: none; --sombra-2: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --verde: #8CCBA5; --verde-2: #5DB283; --verde-3: #1F332A; --verde-tinta: #A6D9BA;
  --fundo: #121A17; --papel: #18231F; --papel-2: #1D2925; --linha: #2A3934; --linha-forte: #3A4B45;
  --texto: #E4ECE8; --texto-2: #A7B6B0; --texto-3: #8A9A94;
  --rec: #5DB283; --ok-fundo: #1F332A; --cli: #D8B25E; --cli-fundo: #352D1B;
  --venc: #E08A72; --venc-fundo: #3A2520; --fun: #8DB6E0; --fun-fundo: #1E2C3A;
  --topo: #0B2A20; --topo-texto: #E4ECE8; --topo-2: #8FB9A1; --topo-acento: #8CCBA5;
  --pri-texto: #0B1A14; --sombra: none; --sombra-2: none; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
html { background: var(--fundo); }
body {
  margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--fonte); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--verde-2); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
img { max-width: 100%; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- barra institucional ---------- */
.topo {
  position: sticky; top: 0; z-index: 20; background: var(--topo); color: var(--topo-texto);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 0; box-shadow: 0 6px 18px rgba(8, 30, 22, .18);
}
.topo-in { display: flex; align-items: center; gap: 10px; min-height: 52px; padding-bottom: 8px; }
.logo { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.logo img { height: 34px; width: auto; display: block; flex: none; }
.logo-div { width: 1px; height: 26px; background: rgba(255, 255, 255, .24); flex: none; }
.logo-txt { font-family: var(--fonte-cond); font-weight: 500; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--topo-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo h1 { font-family: var(--fonte-cond); font-weight: 700; font-size: 22px; margin: 0; line-height: 1.1; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo h1 small { display: block; font-family: var(--fonte); font-weight: 500; font-size: 13px; color: var(--topo-2); overflow: hidden; text-overflow: ellipsis; }
.btn-icone { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: inherit; display: grid; place-items: center; flex: none; }
.btn-icone:active { background: rgba(255, 255, 255, .12); }
.pilula {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06); color: var(--topo-texto);
  font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; max-width: 52vw; overflow: hidden; text-overflow: ellipsis;
}
.pilula .ponto { width: 8px; height: 8px; border-radius: 50%; background: #6CC08B; flex: none; }
.pilula.off .ponto { background: #E3A04F; }
.pilula.sync .ponto { animation: pulsa 1s infinite alternate; }
@keyframes pulsa { to { opacity: .25; } }

/* etapas como abas da barra (mesma navegação dos sistemas Rijo) */
.passos { display: flex; gap: 2px; overflow-x: auto; margin: 0 -16px; padding: 0 12px; scrollbar-width: none; }
.passos::-webkit-scrollbar { display: none; }
.passo {
  position: relative; flex: none; border: 0; border-radius: 8px 8px 0 0; background: none; color: var(--topo-2);
  padding: 9px 12px 12px; font-weight: 500; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.passo[aria-current="step"] { color: var(--topo-texto); background: rgba(255, 255, 255, .1); font-weight: 600; }
.passo[aria-current="step"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--topo-acento); }
.passo .feito { width: 16px; height: 16px; border-radius: 50%; background: var(--topo-acento); color: #0B2A20; display: grid; place-items: center; }

/* ---------- conteúdo ---------- */
main { padding: 18px 16px calc(112px + env(safe-area-inset-bottom, 0px)); max-width: 680px; margin: 0 auto; display: grid; gap: 14px; }
.saudacao { display: grid; gap: 2px; }
.saudacao b { font-family: var(--fonte-cond); font-size: 28px; font-weight: 700; line-height: 1.1; }
.saudacao span { color: var(--texto-2); font-size: 15px; }
.cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.cartao h2 { margin: 0; font-family: var(--fonte-cond); font-weight: 600; font-size: 20px; line-height: 1.2; }
.cartao h3 { margin: 0; font-size: 15px; font-weight: 600; }
.rotulo { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-3); }
.obra-cab { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.cod { font-family: var(--fonte-cond); font-weight: 700; font-size: 26px; line-height: 1; color: var(--verde); white-space: nowrap; }
.cod.p { font-size: 16px; }
.obra-nome { font-size: 15px; color: var(--texto-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.mudo { color: var(--texto-2); font-size: 14px; }
.linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.linha > .cresce { flex: 1; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.estado { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-weight: 600; font-size: 15px; border: 1px solid var(--linha); border-left-width: 4px; background: var(--papel); text-align: left; width: 100%; }
.estado svg { flex: none; }
.estado.ok { border-left-color: var(--verde-2); background: var(--ok-fundo); color: var(--verde-tinta); }
.estado.warn { border-left-color: var(--cli); background: var(--cli-fundo); color: var(--cli); }
.estado.bad { border-left-color: var(--venc); background: var(--venc-fundo); color: var(--venc); }
.estado.info { border-left-color: var(--fun); background: var(--fun-fundo); color: var(--fun); }
.estado small { display: block; font-weight: 500; font-size: 13px; opacity: .9; }

.btn {
  min-height: var(--tap); border-radius: 8px; border: 1px solid var(--linha-forte); background: var(--papel); padding: 10px 16px;
  font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn:active { transform: translateY(1px); }
.btn.primario { background: var(--verde-2); border-color: var(--verde-2); color: var(--pri-texto); }
.btn.sinal { background: var(--verde); border-color: var(--verde); color: var(--pri-texto); }
.btn.perigo { color: var(--venc); border-color: var(--venc); }
.btn.cheio { width: 100%; }
.btn.mini { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  min-height: 40px; border-radius: 20px; border: 1px solid var(--linha-forte); background: var(--papel); padding: 6px 14px;
  font-size: 15px; font-weight: 500; color: var(--texto-2); display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--verde-3); border-color: var(--verde-2); color: var(--verde-tinta); font-weight: 600; }
.chip.falta[aria-pressed="true"] { background: var(--venc-fundo); border-color: var(--venc); color: var(--venc); }

.rodape {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--papel); border-top: 1px solid var(--linha);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: center;
  box-shadow: 0 -4px 14px rgba(15, 61, 46, .06);
}
.rodape .btn { flex: 1; max-width: 320px; }

/* ---------- clima ---------- */
.periodo { display: grid; gap: 12px; }
.periodo-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.periodo-topo h2 { font-size: 22px; }
.liga { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; min-height: 40px; color: var(--texto-2); }
.liga input { width: 22px; height: 22px; accent-color: var(--verde-2); }
.tempos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tempo {
  border: 1px solid var(--linha-forte); background: var(--papel-2); border-radius: 10px; padding: 8px 4px; min-height: 76px; color: var(--texto-2);
  display: grid; justify-items: center; align-content: center; gap: 4px; font-size: 13px; font-weight: 600; line-height: 1.1;
}
.tempo[aria-pressed="true"] { border-color: var(--verde-2); background: var(--verde-3); color: var(--verde-tinta); box-shadow: inset 0 0 0 1px var(--verde-2); }
.condicoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.condicao { min-height: 44px; border-radius: 10px; border: 1px solid var(--linha-forte); background: var(--papel-2); font-weight: 600; color: var(--texto-2); }
.condicao[aria-pressed="true"].pra { background: var(--ok-fundo); color: var(--rec); border-color: var(--rec); }
.condicao[aria-pressed="true"].imp { background: var(--venc-fundo); color: var(--venc); border-color: var(--venc); }
.periodo.desligado .tempos, .periodo.desligado .condicoes { opacity: .35; pointer-events: none; }
.sugestao { font-size: 13px; color: var(--texto-3); display: flex; gap: 6px; align-items: center; }

/* ---------- equipe ---------- */
.efetivo { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; }
.efetivo div { padding: 8px 12px; border-left: 1px solid var(--linha); min-width: 0; }
.efetivo div:first-child { border-left: 0; }
.efetivo b { display: block; font-family: var(--fonte-cond); font-size: 30px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.efetivo span { font-size: 13px; color: var(--texto-2); }
.efetivo .f b { color: var(--venc); }
.pessoas { display: grid; }
.pessoa { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--linha); }
.pessoa:first-child { border-top: 0; padding-top: 0; }
.pessoa-topo { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pessoa-nome { flex: 1; min-width: 0; }
.pessoa-nome b { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.pessoa-nome span { font-size: 13px; color: var(--texto-3); }
.etq { white-space: nowrap; display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 10px; background: var(--verde-3); color: var(--verde-tinta); margin-left: 6px; vertical-align: 2px; }
.etq.nova { background: var(--fun-fundo); color: var(--fun); }
.etq.aviso { background: var(--cli-fundo); color: var(--cli); }
.pres { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--linha-forte); border-radius: 8px; overflow: hidden; flex: none; }
.pres button { border: 0; background: var(--papel-2); min-height: 44px; min-width: 50px; font-weight: 700; font-size: 15px; color: var(--texto-3); }
.pres button + button { border-left: 1px solid var(--linha-forte); }
.pres button[aria-pressed="true"].p { background: var(--rec); color: #fff; }
.pres button[aria-pressed="true"].f { background: var(--venc); color: #fff; }
.pessoa.saiu .pessoa-nome b { text-decoration: line-through; color: var(--texto-3); }
.saida-info { font-size: 14px; color: var(--cli); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- serviços ---------- */
.servico { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--linha); }
.servico:first-child { border-top: 0; padding-top: 0; }
.servico-topo { display: flex; gap: 10px; align-items: baseline; }
.servico-topo b { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.pct { font-family: var(--fonte-cond); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--texto); }
.pct small { font-size: 18px; }
.pct.subiu { color: var(--verde-2); }
.barra-pct { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.barra-pct button { height: 44px; border-radius: 8px; border: 1px solid var(--linha-forte); background: var(--papel-2); font-weight: 700; font-size: 15px; color: var(--texto-2); }
input[type="range"] { width: 100%; height: 44px; accent-color: var(--verde-2); }
.antes { font-size: 13px; color: var(--texto-3); }

/* ---------- fotos ---------- */
.botoes-foto { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.botoes-foto .btn { min-height: 64px; flex-direction: column; gap: 4px; font-size: 15px; }
.orienta { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; }
.orienta svg { color: var(--verde-2); }
.orienta b { display: block; font-size: 15px; }
.orienta span { font-size: 13.5px; color: var(--texto-2); }
.gps { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; flex-wrap: wrap; }
.gps .bolinha { width: 9px; height: 9px; border-radius: 50%; background: var(--texto-3); flex: none; }
.gps.ok { color: var(--verde-tinta); } .gps.ok .bolinha { background: var(--verde-2); }
.gps.buscando { color: var(--cli); } .gps.buscando .bolinha { background: var(--cli); animation: pulsa 1s infinite alternate; }
.gps.erro { color: var(--venc); } .gps.erro .bolinha { background: var(--venc); }
.grade-fotos { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.foto { display: grid; gap: 6px; min-width: 0; }
.foto-img { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--papel-2); max-width: 100%; }
.foto-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-img .rm { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; }
.foto-img .n { position: absolute; left: 8px; top: 8px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.foto-meta { display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; color: var(--texto-3); }
.foto-meta .ok { color: var(--verde-tinta); font-weight: 600; }
.foto-meta .warn { color: var(--cli); font-weight: 600; }
.foto-meta .bad { color: var(--venc); font-weight: 600; }
.foto input, .foto select { width: 100%; min-height: 42px; font-size: 15px; }
.corte { position: relative; margin: 0 auto; max-height: 52vh; border-radius: 10px; overflow: hidden; background: #000; }
.corte img { display: block; width: 100%; height: 100%; object-fit: contain; }
.corte-quadro { position: absolute; left: 0; right: 0; border: 3px solid var(--topo-acento); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); border-radius: 4px; transition: top .15s; }

/* ---------- formulários ---------- */
.campo { display: grid; gap: 6px; }
.campo label, .campo .rotulo-campo { font-weight: 600; font-size: 14px; color: var(--texto-2); }
.campo .dica { font-size: 13px; color: var(--texto-3); }
.campo .erro { font-size: 13px; color: var(--venc); font-weight: 600; }
input[type="text"], input[type="tel"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; min-height: var(--tap); border: 1px solid var(--linha-forte); border-radius: 8px; background: var(--papel); padding: 10px 12px; font-size: 16px;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--verde-2); outline: none; box-shadow: 0 0 0 3px var(--verde-3); }
.invalido { border-color: var(--venc) !important; }

/* ---------- folha (bottom sheet) ---------- */
#sheet { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; background: rgba(10, 20, 16, .45); }
.folha {
  background: var(--fundo); border-radius: 16px 16px 0 0; max-height: 92vh; overflow-y: auto; width: 100%; max-width: 680px; margin: 0 auto;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; box-shadow: 0 -4px 18px rgba(0, 0, 0, .18);
}
.folha-alca { width: 44px; height: 5px; border-radius: 3px; background: var(--linha-forte); margin: 4px auto 0; }
.folha-topo { display: flex; align-items: center; gap: 8px; }
.folha-topo h2 { flex: 1; margin: 0; font-family: var(--fonte-cond); font-weight: 600; font-size: 22px; }
.folha-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lista-sel { display: grid; gap: 8px; }
.item-sel {
  width: 100%; text-align: left; border: 1px solid var(--linha); border-radius: 10px; background: var(--papel); padding: 10px 12px; min-height: 52px;
  display: flex; align-items: center; gap: 10px; color: var(--texto);
}
.item-sel[aria-pressed="true"] { border-color: var(--verde-2); background: var(--verde-3); color: var(--verde-tinta); }
.item-sel .cresce { flex: 1; min-width: 0; }
.item-sel small { display: block; color: var(--texto-3); font-size: 13px; }

/* ---------- revisão / fila ---------- */
.resumo { display: grid; gap: 6px; }
.resumo-linha { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--linha); padding-top: 8px; }
.resumo-linha:first-child { border-top: 0; padding-top: 0; }
.resumo-linha span { color: var(--texto-2); }
.resumo-linha b { text-align: right; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.pend { display: grid; gap: 8px; }
.tira { display: flex; gap: 6px; overflow-x: auto; }
.tira img { width: 80px; height: 60px; object-fit: cover; border-radius: 6px; flex: none; background: var(--papel-2); }
.vazio { text-align: center; color: var(--texto-3); padding: 18px 8px; display: grid; gap: 10px; justify-items: center; }
.vazio b { color: var(--texto); font-family: var(--fonte-cond); font-weight: 600; font-size: 19px; }
.demo-aviso { border: 1px solid var(--linha); border-left: 4px solid var(--cli); background: var(--papel); color: var(--texto-2); font-size: 14px; padding: 10px 14px; border-radius: 10px; }
.demo-aviso b { color: var(--texto); }

#toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: 520px; margin: 0 auto;
  background: var(--texto); color: var(--papel); padding: 12px 16px; border-radius: 8px; font-weight: 600; box-shadow: var(--sombra-2);
}
.ocupado { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(10, 20, 16, .55); color: #fff; font-weight: 600; padding: 24px; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 560px) { .grade-fotos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 380px) { .logo-txt, .logo-div { display: none; } }
</style>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (id, t = 22) => `<svg width="${t}" height="${t}" aria-hidden="true"><use href="#${id}"/></svg>`;
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const pad = n => String(n).padStart(2, '0');
const isoLocal = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoLocal(d); };
const br = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const brAno = iso => iso ? `${br(iso)}/${iso.slice(0, 4)}` : '';
const diaSemana = iso => { const g = new Date(iso + 'T12:00:00').getDay(); return g === 0 ? 7 : g; };
const NOME_DIA = ['', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
const dataLonga = iso => { const s = new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); return s.charAt(0).toUpperCase() + s.slice(1); };
const hora = iso => { try { return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
const mb = b => (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';

/* ---------- banco local (IndexedDB, com memória como reserva) ---------- */
const DB = (() => {
  const LOJAS = ['kv', 'rascunhos', 'fila', 'fotos'];
  const mem = {}; LOJAS.forEach(n => { mem[n] = new Map(); });
  let pdb = null;
  function abrir() {
    if (!pdb) pdb = new Promise(ok => {
      try {
        const r = indexedDB.open('rdo-rijo', 1);
        r.onupgradeneeded = () => LOJAS.forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); });
        r.onsuccess = () => ok(r.result);
        r.onerror = () => ok(null);
        r.onblocked = () => ok(null);
      } catch (e) { ok(null); }
    });
    return pdb;
  }
  async function op(loja, modo, fn, fnMem) {
    const db = await abrir();
    if (!db) return fnMem(mem[loja]);
    return new Promise((ok, ko) => {
      const t = db.transaction(loja, modo);
      const req = fn(t.objectStore(loja));
      t.oncomplete = () => ok(req ? req.result : undefined);
      t.onerror = () => ko(t.error); t.onabort = () => ko(t.error);
    });
  }
  return {
    get: (l, k) => op(l, 'readonly', s => s.get(k), m => m.get(k)),
    put: (l, k, v) => op(l, 'readwrite', s => s.put(v, k), m => { m.set(k, v); }),
    del: (l, k) => op(l, 'readwrite', s => s.delete(k), m => { m.delete(k); }),
    all: l => op(l, 'readonly', s => s.getAll(), m => [...m.values()]),
  };
})();

/* ---------- servidor ---------- */
async function api(acao, dados, ms = 45000) {
  if (DEMO) return Demo.chamar(acao, dados);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ acao, token: S.token, dados }), signal: ctrl.signal, redirect: 'follow' });
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw Object.assign(new Error('Resposta inesperada do servidor (HTTP ' + r.status + ').'), { rede: true }); }
  } catch (e) {
    if (e.rede) throw e;
    throw Object.assign(new Error(e.name === 'AbortError' ? 'Sem resposta do servidor (sinal fraco).' : 'Sem conexão com a internet.'), { rede: true });
  } finally { clearTimeout(t); }
}

async function atualizarBoot() {
  try {
    const r = await api('bootstrap', {});
    if (!r.ok) {
      if (r.codigo === 'token') { S.msgAcesso = r.erro; S.tela = 'acesso'; render(); }
      else toast(r.erro);
      return false;
    }
    S.boot = r; S.online = true;
    await DB.put('kv', 'boot', r);
    renderSuave();
    return true;
  } catch (e) {
    S.online = false; renderSuave();
    return false;
  }
}

/* ---------- fila de envio ---------- */
const ESTADOS_ATIVOS = ['pendente', 'fotos'];

async function salvarItem(it) { await DB.put('fila', it.id, it); }

async function sincronizar() {
  if (S.sincronizando || !S.token) return;
  S.sincronizando = true; renderBarra();
  let mudou = false;
  try {
    for (const it of S.fila.filter(i => ESTADOS_ATIVOS.includes(i.estado))) {
      if (it.estado === 'pendente') {
        const r = await api('enviarDiario', it.payload);
        if (!r.ok) {
          if (['duplicado', 'permissao', 'invalido', 'token'].includes(r.codigo)) { it.estado = 'rejeitado'; it.erro = r.erro; await salvarItem(it); mudou = true; continue; }
          throw Object.assign(new Error(r.erro), { temporario: true });
        }
        it.estado = 'fotos'; it.erro = ''; it.servidor = { status: r.status, avisos: r.avisos || [], envioVobi: r.envioVobi };
        await salvarItem(it); mudou = true;
      }
      let total = it.fotos.length, i = 0;
      for (const f of it.fotos) {
        i++;
        if (f.enviada) continue;
        S.progresso = `Enviando foto ${i} de ${total} · ${it.obra}`; renderBarra();
        const reg = await DB.get('fotos', f.id);
        if (!reg) { f.enviada = true; f.perdida = true; await salvarItem(it); continue; }
        const r = await api('enviarFoto', {
          idDiario: it.id, id: f.id, mime: reg.type || 'image/jpeg', base64: await bufParaBase64(reg.buf),
          legenda: f.legenda || '', idServico: f.idServico || '', ordem: f.ordem,
          tiradaEm: f.tiradaEm || '', lat: f.lat, lon: f.lon, precisao: f.precisao, origemLocal: f.origemLocal, distanciaObraM: f.distanciaObraM, largura: f.largura, altura: f.altura
        }, 120000);
        if (!r.ok) {
          if (r.codigo === 'sem-diario') { it.estado = 'pendente'; await salvarItem(it); break; }
          throw Object.assign(new Error(r.erro), { temporario: true });
        }
        f.enviada = true; await salvarItem(it); mudou = true;
      }
      if (it.estado === 'fotos' && it.fotos.every(f => f.enviada)) {
        it.estado = 'recebido'; it.recebidoEm = new Date().toISOString();
        await salvarItem(it);
        for (const f of it.fotos) { await DB.del('fotos', f.id); liberarUrl(f.id); }
        mudou = true;
      }
    }
    // situação na Vobi dos diários recebidos nos últimos dias
    const limite = Date.now() - 10 * 864e5;
    const acomp = S.fila.filter(i => i.estado === 'recebido' && !(i.servidor && i.servidor.status === 'enviado') && Date.parse(i.recebidoEm) > limite);
    if (acomp.length) {
      const r = await api('situacao', { ids: acomp.map(i => i.id) });
      if (r.ok) for (const it of acomp) {
        const s = r.diarios && r.diarios[it.id];
        if (s) { it.servidor = Object.assign({}, it.servidor, s); await salvarItem(it); mudou = true; }
      }
    }
    // limpa histórico antigo (30 dias)
    for (const it of S.fila.filter(i => (i.estado === 'recebido' || i.estado === 'descartado') && Date.now() - Date.parse(i.recebidoEm || i.criadoEm) > 30 * 864e5)) {
      await DB.del('fila', it.id); S.fila = S.fila.filter(x => x !== it);
    }
    S.online = true; S.erroSync = '';
    if (mudou || !S.boot || Date.now() - Date.parse(S.boot.geradoEm || 0) > 10 * 60000) await atualizarBoot();
    S.ultimaSync = new Date().toISOString(); await DB.put('kv', 'ultimaSync', S.ultimaSync);
  } catch (e) {
    if (e.rede) S.online = false;
    S.erroSync = e.message;
    const it = S.fila.find(i => ESTADOS_ATIVOS.includes(i.estado));
    if (it) { it.erro = e.message; it.tentativas = (it.tentativas || 0) + 1; await salvarItem(it); }
  } finally {
    S.sincronizando = false; S.progresso = '';
    renderSuave();
  }
}

function bufParaBase64(buf) {
  return new Promise(ok => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1] || '');
    fr.readAsDataURL(new Blob([buf], { type: 'image/jpeg' }));
  });
}

/* ---------- estado da obra: servidor + o que ainda está só no celular ---------- */
function estadoObra(cod) {
  const ob = obraDe(cod) || { equipe: [], servicos: [] };
  const equipe = ob.equipe.map(c => Object.assign({}, c));
  const servicos = ob.servicos.map(s => Object.assign({}, s));
  const gerado = (S.boot && S.boot.geradoEm) || '';
  const pend = S.fila.filter(i => !['rejeitado', 'descartado'].includes(i.estado) && (i.estado !== 'recebido' || (i.recebidoEm || '') > gerado))
    .sort((a, b) => a.data.localeCompare(b.data) || a.criadoEm.localeCompare(b.criadoEm));
  for (const it of pend) {
    const p = it.payload;
    if (it.obra === cod) {
      p.novos.forEach(n => { if (!equipe.some(c => c.id === n.id)) equipe.push(Object.assign({}, n)); });
      p.chegadas.forEach(ch => { if (!equipe.some(c => c.id === ch.id)) equipe.push({ id: ch.id, nome: ch.nome, funcao: ch.funcao, inicio: ch.inicio }); });
      p.atualizacoes.forEach(a => { const c = equipe.find(x => x.id === a.id); if (c) Object.assign(c, a); });
      p.saidas.forEach(s => { const k = equipe.findIndex(x => x.id === s.id); if (k >= 0) equipe.splice(k, 1); });
      p.servicos.forEach(sv => {
        const x = servicos.find(y => y.id === sv.id);
        if (x) { x.percentual = sv.percentual; x.status = sv.percentual >= 100 ? 'concluido' : 'ativo'; }
        else servicos.push({ id: sv.id, nome: sv.nome, percentual: sv.percentual, status: sv.percentual >= 100 ? 'concluido' : 'ativo' });
      });
    } else {
      p.saidas.filter(s => s.motivo === 'transferencia' && s.obraDestino === cod).forEach(s => {
        if (!equipe.some(c => c.id === s.id)) equipe.push({ id: s.id, nome: s.nome, funcao: s.funcao, inicio: s.data });
      });
    }
  }
  equipe.sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
  return { equipe, servicos };
}

/** Diário daquela obra/dia: no servidor, na fila do celular ou em rascunho. */
function situacaoDia(cod, data) {
  const it = S.fila.find(i => i.obra === cod && i.data === data && !['rejeitado', 'descartado'].includes(i.estado));
  if (it) return { tipo: 'fila', it };
  const ob = obraDe(cod);
  const d = ob && ob.diarios.find(x => x.data === data);
  if (d) return { tipo: 'servidor', d };
  if (S.rascunhos[cod + '|' + data]) return { tipo: 'rascunho' };
  return null;
}

function diasFaltando(cod) {
  const cfg = (S.boot && S.boot.config) || { diasTrabalho: [1, 2, 3, 4, 5, 6] };
  const out = [];
  for (let i = 7; i >= 1; i--) {
    const d = somaDias(hoje(), -i);
    if (!cfg.diasTrabalho.includes(diaSemana(d))) continue;
    if (!situacaoDia(cod, d) || situacaoDia(cod, d).tipo === 'rascunho') out.push(d);
  }
  return out;
}

/* ---------- rascunho ---------- */
function novoRascunho(cod, data) {
  const ob = obraDe(cod);
  const est = estadoObra(cod);
  const prev = ob && ob.previsao && ob.previsao[data];
  const clima = {};
  PERIODOS.forEach(p => {
    const sug = prev && prev[p.id];
    clima[p.id] = { checked: p.id !== 'night', weather: sug ? sug.weather : null, status: sug ? sug.status : 'practicable', sugerido: !!sug, chuvaMm: sug ? sug.chuvaMm : null };
  });
  return {
    id: uuid(), obra: cod, data, criadoEm: new Date().toISOString(), passo: 0, clima,
    equipe: est.equipe.map(c => Object.assign({}, c, { presente: true, motivoFalta: '' })),
    servicos: est.servicos.filter(s => (s.percentual || 0) < 100 && s.status !== 'oculto')
      .map(s => ({ id: s.id, nome: s.nome, anterior: s.percentual || 0, percentual: s.percentual || 0, obs: '', trabalhou: false })),
    concluidos: est.servicos.filter(s => (s.percentual || 0) >= 100).length,
    fotos: [], ocorrencias: '', semOcorrencias: false
  };
}

let timerRd = null;
function salvarRd(imediato) {
  if (!S.rd) return;
  const rd = S.rd;
  rd.atualizadoEm = new Date().toISOString();
  S.rascunhos[rd.obra + '|' + rd.data] = true;
  clearTimeout(timerRd);
  const f = () => DB.put('rascunhos', rd.obra + '|' + rd.data, rd);
  if (imediato) return f();
  timerRd = setTimeout(f, 350);
}

async function abrirDiario(cod, data, substituirHistorico) {
  const s = situacaoDia(cod, data);
  if (s && s.tipo !== 'rascunho') { toast(`Já existe diário de ${br(data)} nesta obra.`); if (substituirHistorico) history.back(); return; }
  let rd = await DB.get('rascunhos', cod + '|' + data);
  if (!rd) rd = novoRascunho(cod, data);
  S.rd = rd; S.obra = obraDe(cod); S.passo = rd.passo || 0; S.tela = 'diario';
  if (substituirHistorico) history.replaceState({ tela: 'diario' }, ''); else history.pushState({ tela: 'diario' }, '');
  salvarRd(true);
  render(); window.scrollTo(0, 0);
}

function irPasso(n) {
  S.passo = Math.max(0, Math.min(PASSOS.length - 1, n));
  S.rd.passo = S.passo; salvarRd();
  render(); window.scrollTo(0, 0);
}

function montarPayload(rd) {
  const ativos = rd.equipe.filter(c => !c.saida);
  const clima = {};
  PERIODOS.forEach(p => { const c = rd.clima[p.id]; clima[p.id] = { checked: !!c.checked, weather: c.weather || 'clean', status: c.status || 'practicable' }; });
  return {
    id: rd.id, obra: rd.obra, data: rd.data, versaoApp: VERSAO_APP, criadoEm: rd.criadoEm, clima,
    equipe: ativos.map(c => ({ id: c.id, nome: c.nome, funcao: c.funcao, presente: !!c.presente, motivoFalta: c.presente ? '' : (c.motivoFalta || 'Falta') })),
    novos: rd.equipe.filter(c => c.novo).map(c => ({
      id: c.id, nome: c.nome, funcao: c.funcao, telefone: c.telefone, documento: c.documento, vinculo: c.vinculo,
      empresa: c.empresa || '', alojado: !!c.alojado, alojamento: c.alojado ? c.alojamento : '', inicio: c.inicio
    })),
    chegadas: rd.equipe.filter(c => c.chegada).map(c => ({ id: c.id, nome: c.nome, funcao: c.funcao, inicio: c.inicio })),
    atualizacoes: rd.equipe.filter(c => c.atualizacao && !c.novo).map(c => Object.assign({ id: c.id }, c.atualizacao)),
    saidas: rd.equipe.filter(c => c.saida).map(c => Object.assign({ id: c.id, nome: c.nome, funcao: c.funcao }, c.saida)),
    servicos: rd.servicos.filter(s => s.novo || s.trabalhou || s.percentual !== s.anterior || s.obs)
      .map(s => ({ id: s.id, nome: s.nome, novo: !!s.novo, anterior: s.anterior, percentual: s.percentual, obs: s.obs || '', trabalhou: !!s.trabalhou })),
    ocorrencias: rd.ocorrencias.trim(),
    fotos: rd.fotos.map((f, i) => ({ id: f.id, legenda: f.legenda || '', idServico: f.idServico || '', ordem: i + 1, tiradaEm: f.tiradaEm || '', lat: f.lat === undefined ? null : f.lat, lon: f.lon === undefined ? null : f.lon, precisao: f.precisao || null, origemLocal: f.origemLocal || 'nenhuma', distanciaObraM: f.distanciaObraM === undefined ? null : f.distanciaObraM, largura: f.largura || null, altura: f.altura || null }))
  };
}

function pendencias(rd) {
  const bloq = [], avisos = [];
  const marcados = PERIODOS.filter(p => rd.clima[p.id].checked);
  if (!marcados.length) bloq.push({ passo: 0, txt: 'Marque o clima de pelo menos um período.' });
  marcados.forEach(p => { if (!rd.clima[p.id].weather) bloq.push({ passo: 0, txt: `Escolha o tempo da ${p.nome.toLowerCase()}.` }); });
  const ativos = rd.equipe.filter(c => !c.saida);
  const pres = ativos.filter(c => c.presente).length;
  if (!pres) avisos.push({ passo: 1, txt: 'Ninguém presente na obra neste dia.' });
  const minFotos = (S.boot && S.boot.config && S.boot.config.minFotos) || 1;
  if (rd.fotos.length < minFotos) avisos.push({ passo: 3, txt: rd.fotos.length ? `Só ${rd.fotos.length} foto(s); o mínimo combinado é ${minFotos}.` : 'Nenhuma foto. O diário aparece incompleto no painel.' });
  const semLocal = rd.fotos.filter(f => f.lat === null || f.lat === undefined).length;
  if (semLocal) avisos.push({ passo: 3, txt: `${semLocal} foto(s) sem localização. Para sair georreferenciada, use "Tirar foto" com o GPS ligado.` });
  const longe = rd.fotos.filter(f => f.distanciaObraM !== null && f.distanciaObraM !== undefined && f.distanciaObraM > raioObra()).length;
  if (longe) avisos.push({ passo: 3, txt: `${longe} foto(s) tirada(s) a mais de ${distTxt(raioObra())} da obra.` });
  const atualizados = rd.servicos.filter(s => s.trabalhou || s.percentual !== s.anterior || s.novo).length;
  if (!atualizados) avisos.push({ passo: 2, txt: 'Nenhum serviço atualizado.' });
  if (!rd.ocorrencias.trim() && !rd.semOcorrencias) avisos.push({ passo: 4, txt: 'Ocorrências em branco. Marque "Sem ocorrências" se for o caso.' });
  return { bloq, avisos };
}

function passoFeito(i, rd) {
  switch (PASSOS[i].id) {
    case 'clima': return PERIODOS.some(p => rd.clima[p.id].checked) && PERIODOS.every(p => !rd.clima[p.id].checked || rd.clima[p.id].weather);
    case 'equipe': return !!rd.equipeConferida;
    case 'servicos': return rd.servicos.some(s => s.trabalhou || s.percentual !== s.anterior || s.novo);
    case 'fotos': return rd.fotos.length > 0;
    case 'ocorrencias': return !!rd.ocorrencias.trim() || rd.semOcorrencias;
    default: return false;
  }
}

async function enviarDiario() {
  const rd = S.rd;
  const ob = obraDe(rd.obra);
  const payload = montarPayload(rd);
  const it = {
    id: rd.id, obra: rd.obra, obraNome: ob ? ob.nome : rd.obra, data: rd.data, payload,
    fotos: rd.fotos.map((f, i) => ({ id: f.id, ordem: i + 1, legenda: f.legenda || '', idServico: f.idServico || '', enviada: false, tiradaEm: f.tiradaEm || '', lat: f.lat === undefined ? null : f.lat, lon: f.lon === undefined ? null : f.lon, precisao: f.precisao || null, origemLocal: f.origemLocal || 'nenhuma', distanciaObraM: f.distanciaObraM === undefined ? null : f.distanciaObraM, largura: f.largura || null, altura: f.altura || null })),
    estado: 'pendente', criadoEm: new Date().toISOString(), tentativas: 0, erro: ''
  };
  clearTimeout(timerRd);
  await salvarItem(it);
  S.fila.push(it);
  await DB.del('rascunhos', rd.obra + '|' + rd.data);
  delete S.rascunhos[rd.obra + '|' + rd.data];
  S.rd = null; S.sheet = null; S.tela = 'inicio'; pararGPS();
  history.replaceState({ tela: 'inicio' }, '');
  render(); window.scrollTo(0, 0);
  toast(navigator.onLine ? 'Diário guardado. Enviando…' : 'Diário guardado no celular. Vai sozinho quando pegar sinal.');
  sincronizar();
}

async function descartarRascunho() {
  const rd = S.rd;
  for (const f of rd.fotos) { await DB.del('fotos', f.id); liberarUrl(f.id); }
  clearTimeout(timerRd);
  await DB.del('rascunhos', rd.obra + '|' + rd.data);
  delete S.rascunhos[rd.obra + '|' + rd.data];
  S.rd = null; S.sheet = null; S.tela = 'inicio'; pararGPS();
  history.replaceState({ tela: 'inicio' }, '');
  render(); toast('Rascunho descartado.');
}

/* ---------- localização: GPS do aparelho (funciona sem internet) ---------- */
const GPS = { id: null, pos: null, erro: '', buscando: false };
function iniciarGPS() {
  if (GPS.id !== null) return;
  if (!navigator.geolocation) { GPS.erro = 'Este celular não informa a localização.'; gpsDemo(); return; }
  GPS.buscando = true;
  try {
    GPS.id = navigator.geolocation.watchPosition(p => {
      GPS.pos = { lat: p.coords.latitude, lon: p.coords.longitude, precisao: Math.round(p.coords.accuracy), em: Date.now() };
      GPS.erro = ''; GPS.buscando = false; atualizarGpsUI();
    }, e => {
      GPS.buscando = false;
      GPS.erro = e && e.code === 1 ? 'Localização bloqueada. Permita a localização para este app nas configurações do navegador.' : 'Sem sinal de GPS agora. Vá para uma área mais aberta.';
      if (e && e.code === 1) pararGPS();
      gpsDemo(); atualizarGpsUI();
    }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
  } catch (e) { GPS.buscando = false; GPS.id = null; GPS.erro = 'Localização indisponível.'; gpsDemo(); }
}
function pararGPS() { if (GPS.id !== null && navigator.geolocation) navigator.geolocation.clearWatch(GPS.id); GPS.id = null; GPS.buscando = false; }
/** Na demonstração (navegador sem permissão de localização) usa um ponto de exemplo, marcado como tal. */
function gpsDemo() { if (DEMO && !gpsFresco()) { GPS.pos = { lat: -8.054280, lon: -34.881060, precisao: 9, em: Date.now(), demo: true }; GPS.erro = ''; } }
function gpsFresco() { return GPS.pos && Date.now() - GPS.pos.em < 120000 ? GPS.pos : null; }
function htmlGps() {
  const p = gpsFresco();
  if (p) return `<div class="gps ok" id="gpsStatus"><span class="bolinha"></span>Localização pronta · precisão ±${p.precisao} m${p.demo ? ' (ponto de exemplo)' : ''}</div>`;
  if (GPS.erro) return `<div class="gps erro" id="gpsStatus"><span class="bolinha"></span>${esc(GPS.erro)} <button class="btn mini" data-act="gpsDeNovo">Tentar de novo</button></div>`;
  return `<div class="gps buscando" id="gpsStatus"><span class="bolinha"></span>Buscando localização (GPS)…</div>`;
}
function atualizarGpsUI() { const el = document.getElementById('gpsStatus'); if (el) el.outerHTML = htmlGps(); }
function pegarPosicao(ms) {
  const p = gpsFresco();
  if (p) return Promise.resolve(p);
  iniciarGPS();
  return new Promise(ok => {
    const t0 = Date.now();
    const iv = setInterval(() => { const q = gpsFresco(); if (q || GPS.erro || Date.now() - t0 > ms) { clearInterval(iv); ok(q); } }, 250);
  });
}
function distanciaM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
const distTxt = m => m >= 1000 ? (m / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' km' : m + ' m';
const raioObra = () => (S.boot && S.boot.config && S.boot.config.raioObraM) || 1000;

/* ---------- EXIF: data e GPS gravados pela câmera (quando o celular deixa passar) ---------- */
function lerExif(buf) {
  const v = new DataView(buf);
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let o = 2;
  while (o < v.byteLength - 10) {
    const m = v.getUint16(o);
    if ((m & 0xFF00) !== 0xFF00) break;
    const len = v.getUint16(o + 2);
    if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) return lerTiff(v, o + 10);
    if (m === 0xFFDA) break;
    o += 2 + len;
  }
  return null;
}
function lerTiff(v, t) {
  const le = v.getUint16(t) === 0x4949;
  const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
  const ifd = p => { const n = u16(t + p), out = {}; for (let i = 0; i < n; i++) { const e = t + p + 2 + i * 12; out[u16(e)] = { tipo: u16(e + 2), n: u32(e + 4), val: e + 8 }; } return out; };
  const numero = ent => {   // RATIONAL (5), DOUBLE (12), SHORT (3) ou LONG (4)
    if (ent.tipo === 5) return rat(u32(ent.val));
    if (ent.tipo === 12) return v.getFloat64(t + u32(ent.val), le);
    if (ent.tipo === 3) return u16(ent.val);
    if (ent.tipo === 4) return u32(ent.val);
    return null;
  };
  const rat = p => u32(t + p) / (u32(t + p + 4) || 1);
  const ascii = ent => { const off = ent.n > 4 ? t + u32(ent.val) : ent.val; let s = ''; for (let i = 0; i < ent.n - 1; i++) s += String.fromCharCode(v.getUint8(off + i)); return s; };
  const r = {};
  const i0 = ifd(u32(t + 4));
  if (i0[0x8769]) { const ex = ifd(u32(i0[0x8769].val)); if (ex[0x9003]) r.data = ascii(ex[0x9003]); }
  if (!r.data && i0[0x0132]) r.data = ascii(i0[0x0132]);
  if (i0[0x8825]) {
    const g = ifd(u32(i0[0x8825].val));
    const coord = (k, ref) => {
      if (!g[k] || g[k].n < 3) return null;
      const off = u32(g[k].val);
      let x = rat(off) + rat(off + 8) / 60 + rat(off + 16) / 3600;
      const rf = g[ref] ? String.fromCharCode(v.getUint8(g[ref].val)) : '';
      if (rf === 'S' || rf === 'W') x = -x;
      return isFinite(x) ? x : null;
    };
    r.lat = coord(2, 1); r.lon = coord(4, 3);
    if (g[0x1F]) { const pr = numero(g[0x1F]); r.precisao = pr > 0 && pr < 10000 ? pr : null; }
    if (!r.lat && !r.lon) { r.lat = null; r.lon = null; }
  }
  if (r.data) {
    const m = r.data.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
    r.quando = m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
    if (r.quando && (isNaN(r.quando) || r.quando.getFullYear() < 2015)) r.quando = null;
  }
  return r;
}

/* ---------- fotos: sempre horizontais, com marca d'água Rijo (obra, data, hora e coordenadas) ---------- */
async function processarArquivos(files, origem) {
  if (!files || !files.length || !S.rd) return;
  ocupado(origem === 'camera' ? 'Gravando a foto com data, hora e localização…' : `Preparando ${files.length > 1 ? files.length + ' fotos' : 'a foto'}…`);
  let ok = 0;
  for (const file of files) {
    try {
      const r = await prepararFoto(file, origem);
      if (r.retrato) S.cortes.push(r);
      else { await guardarFoto(r); ok++; }
    } catch (e) { toast('Não consegui ler uma das fotos: ' + e.message); }
  }
  ocupado(false);
  salvarRd(true);
  render();
  if (ok) toast(ok === 1 ? 'Foto adicionada.' : `${ok} fotos adicionadas.`);
  if (S.cortes.length) abrirCorte();
}

function carregarImagem(fonte) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fonte);
    const img = new Image();
    img.onload = () => { ok(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('formato não suportado')); };
    img.src = url;
  });
}
async function decodificar(blob) {
  if (window.createImageBitmap) { try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { /* cai no <img> */ } }
  return carregarImagem(blob);
}
const novoCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function canvasBlob(cv, q) {
  return new Promise((ok, ko) => cv.toBlob(b => (b ? ok(b) : ko(new Error('falha ao comprimir'))), 'image/jpeg', q));
}

async function prepararFoto(file, origem) {
  let exif = null;
  try { exif = lerExif(await file.slice(0, 262144).arrayBuffer()); } catch (e) { exif = null; }
  const fonte = await decodificar(file);
  const w0 = fonte.width || fonte.naturalWidth, h0 = fonte.height || fonte.naturalHeight;
  const fator = Math.min(1, CFG.FOTO_MAX_PX / Math.max(w0, h0));
  const w = Math.round(w0 * fator), h = Math.round(h0 * fator);
  const cv = novoCanvas(w, h);
  cv.getContext('2d').drawImage(fonte, 0, 0, w, h);
  if (fonte.close) fonte.close();

  // quando: data da câmera (EXIF); senão, agora (câmera do app) ou a data do arquivo (galeria)
  let quando = exif && exif.quando ? exif.quando : null;
  if (!quando) quando = origem === 'camera' ? new Date() : new Date(file.lastModified || Date.now());
  // onde: GPS gravado na foto (EXIF); senão, o GPS do celular agora — só para foto tirada pelo app
  let local = null, origemLocal = 'nenhuma';
  if (exif && exif.lat !== null && exif.lat !== undefined && exif.lon !== null && exif.lon !== undefined) {
    local = { lat: exif.lat, lon: exif.lon, precisao: exif.precisao ? Math.round(exif.precisao) : null }; origemLocal = 'exif';
  } else if (origem === 'camera') {
    const p = await pegarPosicao(8000);
    if (p) { local = { lat: p.lat, lon: p.lon, precisao: p.precisao }; origemLocal = p.demo ? 'exemplo' : 'gps'; }
  }
  const meta = { quando: quando.toISOString(), local, origemLocal, origem };
  if (h > w * 1.02) {          // em pé: guarda sem carimbo e pede o recorte horizontal
    const id = uuid();
    const blob = await canvasBlob(cv, 0.9);
    await DB.put('fotos', 'pend-' + id, { buf: await blob.arrayBuffer(), type: 'image/jpeg', w, h });
    return { retrato: true, id, w, h, meta };
  }
  return { retrato: false, cv, meta };
}

async function guardarFoto(r) {
  await carimbar(r.cv, r.meta);
  const blob = await canvasBlob(r.cv, CFG.FOTO_QUALIDADE);
  const id = r.id || uuid();
  await DB.put('fotos', id, { buf: await blob.arrayBuffer(), type: 'image/jpeg', w: r.cv.width, h: r.cv.height });
  const ob = obraDe(S.rd.obra);
  const loc = r.meta.local;
  const dist = loc && ob && ob.latitude !== null && ob.latitude !== undefined && ob.longitude !== null && ob.longitude !== undefined
    ? distanciaM(loc, { lat: ob.latitude, lon: ob.longitude }) : null;
  S.rd.fotos.push({
    id, legenda: '', idServico: '', bytes: blob.size, tiradaEm: r.meta.quando, origem: r.meta.origem,
    lat: loc ? loc.lat : null, lon: loc ? loc.lon : null, precisao: loc ? loc.precisao : null, origemLocal: r.meta.origemLocal,
    distanciaObraM: dist, largura: r.cv.width, altura: r.cv.height
  });
}

let _logo = null;
function logoImg() {
  if (!_logo) _logo = new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = LOGO_NEG; });
  return _logo;
}
function caber(ctx, t, max) {
  if (ctx.measureText(t).width <= max) return t;
  while (t.length > 4 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}
/** Faixa inferior: logomarca Rijo + obra · data e hora · engenheiro · coordenadas e precisão. */
async function carimbar(cv, meta) {
  if (!CFG.CARIMBO_FOTO) return;
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
  const fs = Math.max(13, Math.round(w * 0.021));
  const lh = Math.round(fs * 1.32), mg = Math.round(fs * 0.75);
  const faixa = lh * 3 + mg * 2, y0 = h - faixa;
  ctx.fillStyle = 'rgba(11, 42, 32, .84)';
  ctx.fillRect(0, y0, w, faixa);
  ctx.fillStyle = '#8CCBA5';
  ctx.fillRect(0, y0, w, Math.max(2, Math.round(fs * 0.12)));
  let x = mg;
  const logo = await logoImg();
  if (logo) {
    const alt = Math.round(lh * 2.1), larg = Math.round(alt * logo.width / logo.height);
    ctx.drawImage(logo, x, Math.round(y0 + (faixa - alt) / 2), larg, alt);
    x += larg + mg;
    ctx.fillStyle = 'rgba(255, 255, 255, .3)';
    ctx.fillRect(x, y0 + mg, Math.max(1, Math.round(fs * 0.06)), faixa - mg * 2);
    x += mg;
  }
  const ob = obraDe(S.rd.obra) || {};
  const q = new Date(meta.quando);
  const eng = (S.boot && S.boot.engenheiro && S.boot.engenheiro.nome) || '';
  const linhas = [
    `${S.rd.obra} · ${nomeCurto(ob.nome, S.rd.obra)}`,
    `${q.toLocaleDateString('pt-BR')} ${pad(q.getHours())}:${pad(q.getMinutes())}:${pad(q.getSeconds())}${eng ? ' · ' + eng : ''}`,
    meta.local ? `Lat ${meta.local.lat.toFixed(6)}   Long ${meta.local.lon.toFixed(6)}${meta.local.precisao ? '   ±' + meta.local.precisao + ' m' : ''}${meta.origemLocal === 'exemplo' ? ' (exemplo)' : ''}`
      : 'Localização não registrada na foto'
  ];
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFFFFF';
  linhas.forEach((t, i) => {
    ctx.font = `${i === 0 ? 700 : 500} ${fs}px Barlow, system-ui, -apple-system, "Segoe UI", sans-serif`;
    ctx.fillText(caber(ctx, t, w - x - mg), x, Math.round(y0 + mg + lh * i + lh / 2));
  });
}

/* foto em pé: o engenheiro escolhe a parte que fica (recorte 4:3 deitado) ou descarta */
function abrirCorte() { const c = S.cortes[0]; if (c) abrirSheet('corte', { id: c.id, w: c.w, h: c.h, pos: 'meio' }); }
async function concluirCorte(usar) {
  const c = S.cortes.shift();
  const pos = S.sheet ? S.sheet.pos : 'meio';
  fecharSheet();
  if (!c) return;
  const reg = await DB.get('fotos', 'pend-' + c.id);
  await DB.del('fotos', 'pend-' + c.id); liberarUrl('pend-' + c.id);
  if (usar && reg) {
    ocupado('Recortando…');
    try {
      const img = await decodificar(new Blob([reg.buf], { type: 'image/jpeg' }));
      const ch = Math.round(c.w * 3 / 4);
      const y = pos === 'cima' ? 0 : pos === 'baixo' ? c.h - ch : Math.round((c.h - ch) / 2);
      const cv = novoCanvas(c.w, ch);
      cv.getContext('2d').drawImage(img, 0, y, c.w, ch, 0, 0, c.w, ch);
      if (img.close) img.close();
      await guardarFoto({ cv, meta: c.meta, id: c.id });
      toast('Recorte horizontal salvo.');
    } catch (e) { toast('Não consegui recortar: ' + e.message); }
    ocupado(false);
  } else toast('Foto descartada. Tire de novo com o celular deitado.');
  salvarRd(true); render();
  if (S.cortes.length) setTimeout(abrirCorte, 350);
}

function liberarUrl(id) { const u = S.urls.get(id); if (u) { URL.revokeObjectURL(u); S.urls.delete(id); } }
async function hidratarFotos() {
  for (const img of document.querySelectorAll('img[data-foto]')) {
    const id = img.dataset.foto;
    let u = S.urls.get(id);
    if (!u) {
      const reg = await DB.get('fotos', id);
      if (!reg) continue;
      u = URL.createObjectURL(new Blob([reg.buf], { type: reg.type || 'image/jpeg' }));
      S.urls.set(id, u);
    }
    if (img.getAttribute('src') !== u) img.src = u;
  }
}

function rotuloSituacao(s, envioVobi) {
  if (!s) return null;
  if (s.tipo === 'rascunho') return { cls: 'warn', txt: 'Rascunho em andamento', sub: 'Toque em continuar para terminar' };
  if (s.tipo === 'fila') {
    const it = s.it;
    if (it.estado === 'pendente' || it.estado === 'fotos') {
      const n = it.fotos.filter(f => !f.enviada).length;
      return { cls: 'warn', txt: 'Guardado no celular', sub: n ? `Falta enviar o diário e ${n} foto(s)` : 'Aguardando sinal para enviar' };
    }
    if (it.estado === 'rejeitado') return { cls: 'bad', txt: 'Recusado pelo servidor', sub: it.erro };
    const sv = it.servidor || {};
    if (sv.status === 'enviado') return { cls: 'ok', txt: `Na Vobi · RDO nº ${sv.codigoVobi}`, sub: 'Enviado e conferido' };
    if (sv.status === 'erro') return { cls: 'bad', txt: 'Recebido, com erro na Vobi', sub: 'O escritório já foi avisado' };
    return { cls: 'info', txt: 'Recebido pelo servidor', sub: sv.envioVobi === false ? 'Envio à Vobi ainda desligado (fase de teste)' : 'Indo para a Vobi' };
  }
  const d = s.d;
  if (d.status === 'enviado') return { cls: 'ok', txt: `Na Vobi · RDO nº ${d.codigo}`, sub: d.origem === 'vobi' ? 'Lançado direto na Vobi' : (d.engenheiro ? 'Por ' + d.engenheiro : '') };
  if (d.status === 'erro') return { cls: 'bad', txt: 'Erro ao enviar à Vobi', sub: d.erro || 'O escritório já foi avisado' };
  return { cls: 'info', txt: 'Recebido pelo servidor', sub: envioVobi === false ? 'Envio à Vobi ainda desligado (fase de teste)' : 'Indo para a Vobi' };
}

function cartaoObra(o, h) {
  const s = situacaoDia(o.codigo, h);
  const rot = rotuloSituacao(s, o.envioVobi);
  const ult = o.diarios.find(d => d.data < h && d.codigo);
  const falt = diasFaltando(o.codigo);
  const est = estadoObra(o.codigo);
  let html = `<section class="cartao">
    <div class="obra-cab"><span class="cod">${esc(o.codigo)}</span><span class="obra-nome">${esc(nomeCurto(o.nome, o.codigo))}</span></div>
    <div class="mudo">${est.equipe.length} na equipe${o.cidade ? ' · ' + esc(o.cidade) : ''}</div>`;
  html += rot ? `<div class="estado ${rot.cls}">${ic(rot.cls === 'ok' ? 'i-check' : rot.cls === 'bad' ? 'i-alerta' : 'i-relogio')}<span>Hoje: ${esc(rot.txt)}<small>${esc(rot.sub || '')}</small></span></div>`
    : `<div class="estado bad">${ic('i-alerta')}<span>Hoje: diário pendente<small>${ult ? `Último: ${br(ult.data)} (nº ${esc(ult.codigo)})` : 'Nenhum diário recente'}</small></span></div>`;
  if (!s) html += `<button class="btn primario cheio" data-act="abrir" data-obra="${esc(o.codigo)}" data-data="${h}">${ic('i-mais')} Lançar diário de hoje</button>`;
  else if (s.tipo === 'rascunho') html += `<button class="btn sinal cheio" data-act="abrir" data-obra="${esc(o.codigo)}" data-data="${h}">Continuar rascunho ${ic('i-seta')}</button>`;
  if (falt.length) {
    html += `<div class="campo"><span class="rotulo">Dias sem diário</span><div class="chips">${falt.map(d =>
      `<button class="chip" data-act="abrir" data-obra="${esc(o.codigo)}" data-data="${d}">${S.rascunhos[o.codigo + '|' + d] ? '✎ ' : ''}${NOME_DIA[diaSemana(d)]} ${br(d)}</button>`).join('')}</div></div>`;
  }
  html += `<button class="btn" style="min-height:40px;font-size:14px;justify-self:start" data-act="outraData" data-obra="${esc(o.codigo)}">Outra data…</button>`;
  return html + '</section>';
}

function nomeCurto(nome, cod) {
  const s = String(nome || '');
  return s.indexOf('|') >= 0 ? s.split('|').slice(1).join('|').trim() : (s || cod);
}

      <div class="periodo-topo"><h2>${p.nome}</h2>
        <label class="liga"><input type="checkbox" data-bind="climaCheck" data-p="${p.id}" ${c.checked ? 'checked' : ''}> Registrar</label></div>
      <div class="tempos" role="group" aria-label="Tempo ${p.nome}">${TEMPOS.map(t => `<button class="tempo" data-act="tempo" data-p="${p.id}" data-v="${t.id}" aria-pressed="${c.weather === t.id}">${ic(t.icone, 30)}${t.nome}</button>`).join('')}</div>
      <div class="condicoes" role="group" aria-label="Condição de trabalho ${p.nome}">
        <button class="condicao pra" data-act="condicao" data-p="${p.id}" data-v="practicable" aria-pressed="${c.status === 'practicable'}">Praticável</button>
        <button class="condicao imp" data-act="condicao" data-p="${p.id}" data-v="impractical" aria-pressed="${c.status === 'impractical'}">Impraticável</button></div>
      ${c.sugerido && c.chuvaMm !== null && c.chuvaMm !== undefined ? `<div class="sugestao">Previsão: ${String(c.chuvaMm).replace('.', ',')} mm de chuva no período</div>` : ''}
    </section>`;
  });
  return html;
}

function passoEquipe(rd) {
  const ativos = rd.equipe.filter(c => !c.saida);
  const pres = ativos.filter(c => c.presente).length;
  const movs = rd.equipe.filter(c => c.novo || c.chegada || c.saida).length;
  let html = `<section class="cartao"><div class="efetivo">
      <div><b>${pres}</b><span>presentes</span></div><div class="f"><b>${ativos.length - pres}</b><span>faltaram</span></div><div><b>${movs}</b><span>entradas/saídas</span></div></div>
    <div class="linha"><span class="mudo cresce">Pré-preenchido com quem está alocado na obra. Marque só quem faltou.</span>
    <button class="btn" style="min-height:40px;font-size:14px" data-act="todosPresentes">Todos presentes</button></div></section>`;
  html += `<section class="cartao"><div class="pessoas">`;
  if (!rd.equipe.length) html += `<div class="vazio"><b>Nenhum colaborador alocado nesta obra</b><span>Cadastre a equipe abaixo. Amanhã ela já vem preenchida.</span></div>`;
  rd.equipe.forEach((c, i) => {
    const v0 = Object.assign({}, c, c.atualizacao || {});
    const incompleto = !c.novo && (!v0.telefone || !v0.documento);
    const marcas = (c.novo ? '<span class="etq nova">novo</span>' : '') + (c.chegada ? '<span class="etq">chegou</span>' : '') + (c.alojado ? '<span class="etq">alojado</span>' : '') +
      (incompleto ? '<span class="etq aviso">completar cadastro</span>' : '');
    const desde = c.inicio ? `na obra desde ${br(c.inicio)}` : '';
    const sub = [c.funcao, desde, c.vinculo === 'Empreiteiro' && c.empresa ? c.empresa : ''].filter(Boolean).join(' · ');
    if (c.saida) {
      const m = ((S.boot && S.boot.motivosSaida) || []).find(x => x.id === c.saida.motivo);
      html += `<div class="pessoa saiu"><div class="pessoa-topo"><div class="pessoa-nome"><b>${esc(c.nome)}</b><span>${esc(sub)}</span></div></div>
        <div class="saida-info">Saída em ${br(c.saida.data)}: ${esc(m ? m.nome : c.saida.motivo)}${c.saida.obraDestino ? ' → ' + esc(c.saida.obraDestino) : ''}
        <button class="chip" data-act="desfazerSaida" data-i="${i}">Desfazer</button></div></div>`;
      return;
    }
    html += `<div class="pessoa"><div class="pessoa-topo">
        <div class="pessoa-nome"><b>${esc(c.nome)}${marcas}</b><span>${esc(sub)}</span></div>
        <div class="pres" role="group" aria-label="Presença de ${esc(c.nome)}">
          <button class="p" data-act="presenca" data-i="${i}" data-v="1" aria-pressed="${!!c.presente}">P</button>
          <button class="f" data-act="presenca" data-i="${i}" data-v="0" aria-pressed="${!c.presente}">F</button></div>
        <button class="btn-icone" data-act="menuPessoa" data-i="${i}" aria-label="Mais opções para ${esc(c.nome)}">${ic('i-mais-v')}</button>
      </div>
      ${c.presente ? '' : `<div class="chips">${((S.boot && S.boot.motivosFalta) || ['Falta']).map(m => `<button class="chip falta" data-act="motivo" data-i="${i}" data-v="${esc(m)}" aria-pressed="${(c.motivoFalta || 'Falta') === m}">${esc(m)}</button>`).join('')}</div>`}
    </div>`;
  });
  html += `</div></section>
    <div class="botoes-foto"><button class="btn" data-act="novoColab">${ic('i-mais')} Cadastrar novo</button>
    <button class="btn" data-act="trazer">${ic('i-pessoas')} Trazer de outra obra</button></div>`;
  return html;
}

function passoServicos(rd) {
  let html = `<div class="saudacao"><b>Serviços em andamento</b><span>Ajuste o percentual de cada serviço e marque o que foi feito no dia.</span></div><section class="cartao">`;
  if (!rd.servicos.length) html += `<div class="vazio"><b>Nenhum serviço cadastrado nesta obra</b><span>Cadastre os serviços (ex.: Alvenaria do 1º pavimento). Eles ficam salvos para os próximos dias.</span></div>`;
  rd.servicos.forEach((s, i) => {
    const subiu = s.percentual > s.anterior;
    html += `<div class="servico">
      <div class="servico-topo"><b>${esc(s.nome)}${s.novo ? '<span class="etq nova">novo</span>' : ''}</b>
        <span class="pct ${subiu ? 'subiu' : ''}" id="pct-${i}">${s.percentual}<small>%</small></span></div>
      <div class="barra-pct"><button data-act="pctMenos" data-i="${i}" aria-label="Diminuir 5%">−5</button>
        <input type="range" min="0" max="100" step="5" value="${s.percentual}" data-bind="pct" data-i="${i}" aria-label="Percentual de ${esc(s.nome)}">
        <button data-act="pctMais" data-i="${i}" aria-label="Aumentar 5%">+5</button></div>
      <div class="linha"><span class="antes cresce">Antes: ${s.anterior}%${s.percentual < s.anterior ? ' · <b style="color:var(--cli)">diminuiu</b>' : ''}</span>
        <label class="liga"><input type="checkbox" data-bind="trabalhou" data-i="${i}" ${s.trabalhou ? 'checked' : ''}> Trabalhou hoje</label></div>
      <input type="text" data-bind="obsServ" data-i="${i}" value="${esc(s.obs)}" placeholder="Observação (opcional)" aria-label="Observação de ${esc(s.nome)}">
    </div>`;
  });
  html += `</section><button class="btn cheio" data-act="novoServico">${ic('i-mais')} Novo serviço</button>`;
  if (rd.concluidos) html += `<p class="mudo" style="margin:0;text-align:center">${rd.concluidos} serviço(s) já concluído(s) nesta obra não aparecem aqui.</p>`;
  return html;
}

function metaFoto(f) {
  const q = f.tiradaEm ? new Date(f.tiradaEm) : null;
  const p = [];
  if (q) p.push(`<span>${q.toLocaleDateString('pt-BR')} ${pad(q.getHours())}:${pad(q.getMinutes())}</span>`);
  if (f.lat === null || f.lat === undefined) p.push('<span class="warn">sem localização</span>');
  else if (f.distanciaObraM !== null && f.distanciaObraM !== undefined && f.distanciaObraM > raioObra()) p.push(`<span class="bad">a ${distTxt(f.distanciaObraM)} da obra</span>`);
  else p.push(`<span class="ok">${ic('i-pin', 14)} georreferenciada${f.precisao ? ' ±' + f.precisao + ' m' : ''}</span>`);
  return `<div class="foto-meta">${p.join('')}</div>`;
}

function passoFotos(rd) {
  iniciarGPS();
  const total = rd.fotos.reduce((s, f) => s + (f.bytes || 0), 0);
  let html = `<section class="cartao"><div class="orienta">${ic('i-deitado', 54)}<div><b>Celular deitado, sempre</b>
      <span>Foto horizontal, como nos relatórios fotográficos da Caixa e da fiscalização. Foto em pé é recortada ou descartada.</span></div></div>
    ${htmlGps()}</section>
    <div class="botoes-foto">
    <button class="btn primario" data-act="camera">${ic('i-camera', 28)} Tirar foto</button>
    <button class="btn" data-act="galeria">${ic('i-galeria', 28)} Da galeria</button></div>
    <p class="mudo" style="margin:0">${rd.fotos.length ? `${rd.fotos.length} foto(s) · ${mb(total)} · ` : ''}Cada foto sai com a marca Rijo, a obra, data, hora e coordenadas. Ficam no celular até o envio.</p>`;
  if (!rd.fotos.length) return html + `<section class="cartao vazio">${ic('i-camera', 36)}<b>Nenhuma foto ainda</b><span>Fotografe os serviços do dia: frente de trabalho, detalhes, problemas. Use "Tirar foto" para a foto sair georreferenciada.</span></section>`;
  const servs = rd.servicos;
  html += `<section class="cartao"><div class="grade-fotos">${rd.fotos.map((f, i) => `<div class="foto">
      <div class="foto-img"><img data-foto="${f.id}" alt="Foto ${i + 1}"><span class="n">${i + 1}</span>
        <button class="rm" data-act="rmFoto" data-i="${i}" aria-label="Remover foto ${i + 1}">${ic('i-x', 18)}</button></div>
      ${metaFoto(f)}
      <input type="text" data-bind="legenda" data-i="${i}" value="${esc(f.legenda)}" placeholder="Legenda (ex.: alvenaria eixo B)" aria-label="Legenda da foto ${i + 1}">
      ${servs.length ? `<select data-bind="fotoServ" data-i="${i}" aria-label="Serviço da foto ${i + 1}"><option value="">Serviço (opcional)</option>${servs.map(s => `<option value="${esc(s.id)}" ${f.idServico === s.id ? 'selected' : ''}>${esc(s.nome)}</option>`).join('')}</select>` : ''}
    </div>`).join('')}</div></section>`;
  return html;
}

function passoOcorrencias(rd) {
  return `<div class="saudacao"><b>Ocorrências e observações</b><span>Visitas, entregas, paralisações, problemas. Toque nos atalhos para começar a linha.</span></div>
    <section class="cartao"><div class="chips">${ATALHOS_OCORRENCIA.map(a => `<button class="chip" data-act="atalho" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>
    <textarea id="txtOcorr" data-bind="ocorrencias" placeholder="Ex.: Entrega de 8 m³ de concreto às 10h. Chuva forte das 14h às 15h30 parou a alvenaria.">${esc(rd.ocorrencias)}</textarea>
    <label class="liga"><input type="checkbox" data-bind="semOcorr" ${rd.semOcorrencias ? 'checked' : ''}> Sem ocorrências neste dia</label></section>`;
}

function passoRevisar(rd) {
  const p = pendencias(rd);
  const ativos = rd.equipe.filter(c => !c.saida);
  const pres = ativos.filter(c => c.presente).length;
  const clima = PERIODOS.filter(x => rd.clima[x.id].checked).map(x => {
    const c = rd.clima[x.id]; const t = TEMPOS.find(t => t.id === c.weather);
    return `${x.nome}: ${t ? t.nome : '—'}${c.status === 'impractical' ? ' (impraticável)' : ''}`;
  }).join(' · ') || '—';
  const serv = rd.servicos.filter(s => s.trabalhou || s.percentual !== s.anterior || s.novo);
  const movs = rd.equipe.filter(c => c.novo || c.chegada || c.saida);
  let html = `<div class="saudacao"><b>Revisar e enviar</b><span>${esc(rd.obra)} · ${dataLonga(rd.data)}</span></div>`;
  if (p.bloq.length || p.avisos.length) {
    html += `<section class="cartao pend">${p.bloq.map(x => `<button class="estado bad" style="border:0;text-align:left" data-act="passo" data-n="${x.passo}">${ic('i-alerta')}<span>${esc(x.txt)}<small>Obrigatório · toque para corrigir</small></span></button>`).join('')}
      ${p.avisos.map(x => `<button class="estado warn" style="border:0;text-align:left" data-act="passo" data-n="${x.passo}">${ic('i-alerta')}<span>${esc(x.txt)}<small>Toque para ajustar, ou envie assim</small></span></button>`).join('')}</section>`;
  } else html += `<div class="estado ok">${ic('i-check')}<span>Tudo preenchido</span></div>`;
  html += `<section class="cartao resumo">
    <div class="resumo-linha"><span>Clima</span><b>${esc(clima)}</b></div>
    <div class="resumo-linha"><span>Efetivo</span><b class="num">${pres} presente${pres === 1 ? '' : 's'} · ${ativos.length - pres} falta${ativos.length - pres === 1 ? '' : 's'}</b></div>
    ${movs.length ? `<div class="resumo-linha"><span>Movimentação</span><b>${movs.map(c => esc(c.nome.split(' ')[0]) + (c.saida ? ' (saiu)' : c.novo ? ' (novo)' : ' (chegou)')).join(', ')}</b></div>` : ''}
    <div class="resumo-linha"><span>Serviços</span><b>${serv.length ? serv.map(s => `${esc(s.nome)}: ${s.anterior}→${s.percentual}%`).join('<br>') : 'nenhum atualizado'}</b></div>
    <div class="resumo-linha"><span>Fotos</span><b class="num">${rd.fotos.length}</b></div>
    <div class="resumo-linha"><span>Ocorrências</span><b>${rd.ocorrencias.trim() ? esc(rd.ocorrencias.trim().slice(0, 140)) + (rd.ocorrencias.trim().length > 140 ? '…' : '') : (rd.semOcorrencias ? 'sem ocorrências' : '—')}</b></div>
  </section>`;
  if (rd.fotos.length) html += `<div class="tira">${rd.fotos.map(f => `<img data-foto="${f.id}" alt="">`).join('')}</div>`;
  html += `<p class="mudo" style="margin:0">Ao enviar, o diário fica guardado no celular e sobe sozinho quando houver sinal. Na Vobi ele entra como <b>Concluído</b>, com número automático.</p>
    <button class="btn perigo" data-act="descartar">${ic('i-lixo', 18)} Descartar rascunho</button>`;
  return html;
}

/* =====================================================================
   FOLHAS (cadastro, saída, trazer, novo serviço, outra data, confirmações)
   ===================================================================== */
function abrirSheet(tipo, dados) { S.sheet = Object.assign({ tipo }, dados || {}); history.pushState({ sheet: true }, ''); renderSheet(); }
function fecharSheet(viaHistorico) {
  if (!S.sheet) return;
  S.sheet = null; renderSheet();
  if (!viaHistorico) { S.ignorarPop = true; history.back(); }
}

function renderSheet() {
  const el = $('#sheet');
  if (!S.sheet) { el.hidden = true; el.innerHTML = ''; return; }
  const f = { pessoa: folhaPessoa, cadastro: folhaCadastro, saida: folhaSaida, trazer: folhaTrazer, servico: folhaServico, outraData: folhaOutraData, confirmar: folhaConfirmar, descartar: folhaDescartar, corte: folhaCorte }[S.sheet.tipo];
  el.innerHTML = `<div class="folha" role="dialog" aria-modal="true"><div class="folha-alca"></div>${f(S.sheet)}</div>`;
  el.hidden = false;
  const foco = el.querySelector('[data-foco]'); if (foco) setTimeout(() => foco.focus(), 50);
  hidratarFotos();
}
const cab = t => `<div class="folha-topo"><h2>${t}</h2><button class="btn-icone" data-act="fecharSheet" aria-label="Fechar">${ic('i-x')}</button></div>`;

function folhaPessoa(sh) {
  const c = S.rd.equipe[sh.i];
  return cab(esc(c.nome)) + `<div class="mudo">${esc([c.funcao, c.telefone].filter(Boolean).join(' · '))}${c.alojado ? ' · alojado' + (c.alojamento ? ' em ' + esc(c.alojamento) : '') : ''}</div>
    <div class="lista-sel">
      <button class="item-sel" data-act="abrirSaida" data-i="${sh.i}">${ic('i-seta')}<span class="cresce">Saiu da obra<small>Transferência para outra obra, fim do serviço, demissão…</small></span></button>
      <button class="item-sel" data-act="abrirEditar" data-i="${sh.i}">${ic('i-pessoas')}<span class="cresce">${c.novo ? 'Corrigir cadastro' : 'Atualizar cadastro'}<small>Telefone, documento, função, alojamento</small></span></button>
      ${(c.novo || c.chegada) ? `<button class="item-sel" data-act="removerPessoa" data-i="${sh.i}">${ic('i-lixo')}<span class="cresce">Tirar da lista<small>Lançado por engano neste diário</small></span></button>` : ''}
    </div>`;
}

function campo(id, rot, valor, extra) {
  extra = extra || {};
  return `<div class="campo"><label for="${id}">${rot}${extra.obrig ? ' *' : ''}</label>
    <input type="${extra.tipo || 'text'}" id="${id}" value="${esc(valor || '')}" ${extra.attrs || ''}>${extra.dica ? `<span class="dica">${extra.dica}</span>` : ''}<span class="erro" id="${id}-erro" hidden></span></div>`;
}

function folhaCadastro(sh) {
  const b = S.boot || {};
  const c = sh.i !== undefined ? S.rd.equipe[sh.i] : { inicio: S.rd.data, alojado: null, vinculo: '' };
  const v = Object.assign({}, c, c.atualizacao || {});
  const funcoes = b.funcoes || [];
  const outraFuncao = v.funcao && !funcoes.includes(v.funcao);
  const editandoExistente = sh.i !== undefined && !c.novo;
  return cab(sh.i === undefined ? 'Novo colaborador' : (c.novo ? 'Corrigir cadastro' : 'Atualizar cadastro')) +
    (sh.i === undefined ? `<p class="mudo" style="margin:0">Primeira vez na Rijo? Preencha tudo uma vez só. Nos próximos dias ele já aparece na lista.</p>` : '') +
    (editandoExistente ? `<div class="mudo"><b>${esc(c.nome)}</b></div>` : campo('fNome', 'Nome completo', v.nome, { obrig: true, attrs: 'data-foco autocomplete="off" autocapitalize="words"' })) +
    `<div class="campo"><label for="fFuncao">Função *</label><select id="fFuncao"><option value="">Escolha…</option>
      ${funcoes.map(f => `<option ${v.funcao === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}<option value="__outra" ${outraFuncao ? 'selected' : ''}>Outra…</option></select>
      <input type="text" id="fFuncaoOutra" placeholder="Qual função?" value="${outraFuncao ? esc(v.funcao) : ''}" ${outraFuncao ? '' : 'hidden'}><span class="erro" id="fFuncao-erro" hidden></span></div>` +
    (editandoExistente ? '' : campo('fInicio', 'Na obra desde', v.inicio, { obrig: true, tipo: 'date', attrs: `max="${S.rd.data}"` })) +
    campo('fTel', 'Telefone', v.telefone, { obrig: true, tipo: 'tel', attrs: 'inputmode="tel" autocomplete="off" placeholder="(81) 9 9999-9999"' }) +
    campo('fDoc', 'Documento (CPF ou RG)', v.documento, { obrig: true, attrs: 'autocomplete="off"', dica: 'Fica só na base interna. Não vai para o diário da Vobi.' }) +
    `<div class="campo"><span class="rotulo-campo">Vínculo *</span><div class="chips" id="fVinculo">${((b.vinculos) || []).map(x => `<button class="chip" data-act="selVinculo" data-v="${esc(x)}" aria-pressed="${v.vinculo === x}">${esc(x)}</button>`).join('')}</div><span class="erro" id="fVinculo-erro" hidden></span></div>` +
    `<div id="boxEmpresa" ${['Empreiteiro', 'Outro'].includes(v.vinculo) ? '' : 'hidden'}>${campo('fEmpresa', 'Empresa / empreiteiro', v.empresa, { attrs: 'autocomplete="off"' })}</div>` +
    `<div class="campo"><span class="rotulo-campo">Está alojado? *</span><div class="chips" id="fAlojado">
      <button class="chip" data-act="selAlojado" data-v="1" aria-pressed="${v.alojado === true}">Sim</button>
      <button class="chip" data-act="selAlojado" data-v="0" aria-pressed="${v.alojado === false}">Não</button></div><span class="erro" id="fAlojado-erro" hidden></span></div>` +
    `<div class="campo" id="boxAloj" ${v.alojado ? '' : 'hidden'}><label for="fAloj">Qual alojamento? *</label>
      <input type="text" id="fAloj" list="listaAloj" value="${esc(v.alojamento || '')}" autocomplete="off" placeholder="Nome ou endereço do alojamento">
      <datalist id="listaAloj">${(b.alojamentos || []).map(a => `<option value="${esc(a)}">`).join('')}</datalist><span class="erro" id="fAloj-erro" hidden></span></div>` +
    `<div class="folha-acoes"><button class="btn" data-act="fecharSheet">Cancelar</button><button class="btn primario" data-act="salvarCadastro">Salvar</button></div>`;
}

function folhaSaida(sh) {
  const c = S.rd.equipe[sh.i];
  const b = S.boot || {};
  const destinos = (b.obrasDestino || []).filter(o => o.codigo !== S.rd.obra);
  const mot = sh.motivo || '';
  return cab('Saída da obra') + `<div class="mudo"><b>${esc(c.nome)}</b> · ${esc(c.funcao)}</div>
    ${campo('fDataSaida', 'Data da saída', sh.data || S.rd.data, { tipo: 'date', attrs: `max="${hoje()}"` })}
    <div class="campo"><span class="rotulo-campo">Motivo *</span><div class="lista-sel">${(b.motivosSaida || []).map(m => `<button class="item-sel" data-act="selMotivoSaida" data-v="${m.id}" aria-pressed="${mot === m.id}">${esc(m.nome)}</button>`).join('')}</div><span class="erro" id="fMotivo-erro" hidden></span></div>
    <div class="campo" ${mot === 'transferencia' ? '' : 'hidden'}><label for="fDestino">Para qual obra? *</label><select id="fDestino"><option value="">Escolha…</option>
      ${destinos.map(o => `<option value="${esc(o.codigo)}" ${sh.destino === o.codigo ? 'selected' : ''}>${esc(o.codigo)} · ${esc(nomeCurto(o.nome, o.codigo))}</option>`).join('')}</select><span class="erro" id="fDestino-erro" hidden></span></div>
    ${campo('fDetalhe', 'Detalhe (opcional)', sh.detalhe || '', { attrs: 'autocomplete="off" placeholder="Ex.: terminou a alvenaria; volta em novembro"' })}
    <div class="folha-acoes"><button class="btn" data-act="fecharSheet">Cancelar</button><button class="btn primario" data-act="salvarSaida">Registrar saída</button></div>`;
}

function folhaTrazer(sh) {
  const naLista = new Set(S.rd.equipe.map(c => c.id));
  const q = (sh.q || '').trim().toLowerCase();
  const lista = ((S.boot && S.boot.outrosColaboradores) || []).filter(c => !naLista.has(c.id) && (!q || String(c.nome).toLowerCase().includes(q) || String(c.funcao).toLowerCase().includes(q))).slice(0, 60);
  const sel = sh.sel ? (S.boot.outrosColaboradores || []).find(c => c.id === sh.sel) : null;
  return cab('Trazer de outra obra') +
    `<p class="mudo" style="margin:0">Quem já é cadastrado na Rijo (em outra obra ou que já trabalhou antes). Quem é novo, use "Cadastrar novo".</p>
